<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>모바일 OMR — 엄형국 수학</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="omr.css?v=5">
<style>
  .code-input{font-size:26px;font-weight:900;letter-spacing:.35em;text-align:center;text-transform:uppercase;padding:14px;}
  .exam-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);
    border-radius:var(--radius);margin-bottom:10px;text-decoration:none;width:100%;text-align:left;}
  .exam-item:hover{border-color:var(--ink);}
  .exam-item .t{font-weight:800;font-size:15.5px;}
  .exam-item .m{font-size:12.5px;color:var(--dim);}
  .sec-h{font-size:13px;font-weight:800;color:var(--dim);letter-spacing:.04em;margin:22px 0 8px;}
  .exam-item .go{margin-left:auto;font-weight:800;color:var(--dim);}
  .pcard{display:block;background:#fff;border-radius:22px;padding:18px 18px 16px;margin:12px 0;box-shadow:0 2px 14px rgba(17,17,20,.05);text-decoration:none;color:inherit;}
  .pcard .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px;}
  .pcard .ph h3{font-size:17px;font-weight:900;margin:0;letter-spacing:-.02em;}
  .pcard .ph span{font-size:12.5px;font-weight:800;color:var(--faint);}
  .pcard .wk{border:0;padding:0;margin:0;background:none;}
  .pcard .trend{border:0;padding:0;margin:0;background:none;}
  .dsum{display:flex;align-items:center;gap:16px;}
  .dsum .sc{font-size:44px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;}
  .dsum .sc small{font-size:15px;color:var(--faint);font-weight:800;letter-spacing:0;}
  .dsum .info{min-width:0;}
  .dsum .info .m{font-size:13px;color:var(--dim);margin-bottom:5px;}
  .dsum .hl{display:flex;flex-wrap:wrap;gap:4px 8px;}
  .dsum .hl span{font-weight:800;font-size:14.5px;padding:0 2px;background:linear-gradient(transparent 50%,#FFE45C 50%);}
  .dsum .ok{font-size:13.5px;font-weight:700;}
  .wk{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:4px 14px;margin-top:4px;}
  .wk a{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);text-decoration:none;font-size:14px;}
  .wk a:last-child{border-bottom:0;}
  .wk .d{flex:0 0 auto;min-width:48px;text-align:center;font-size:12px;font-weight:900;padding:6px 8px;border-radius:10px;background:var(--bg2);color:var(--dim);font-variant-numeric:tabular-nums;}
  .wk .d.red{background:var(--red-soft);color:var(--red);} .wk .d.ok{background:var(--ok-soft);color:var(--ok);} .wk .d.ink{background:var(--ink);color:#fff;}
  .wk .t{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wk .m{margin-left:auto;flex:0 0 auto;font-size:12px;color:var(--dim);}
  .wk .none{padding:14px 0;font-size:13.5px;color:var(--dim);}
  .trend{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:4px 0 8px;}
  .trend .top{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .trend .top b{font-size:26px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
  .trend .top small{font-size:12.5px;color:var(--dim);}
  .trend .chg{margin-left:auto;font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;}
  .trend .chg.up{background:var(--ok-soft);color:var(--ok);} .trend .chg.down{background:var(--red-soft);color:var(--red);}
  .trend svg{width:100%;height:auto;display:block;}
  .trend .lg{display:flex;gap:12px;justify-content:flex-end;font-size:11px;color:var(--dim);margin-top:2px;}
  .trend .lg i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:4px;}
  .quick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:4px 0 6px;}
  .quick a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;background:#fff;border:1px solid var(--line);
    border-radius:14px;text-decoration:none;font-size:12.5px;font-weight:800;}
  .quick a:hover{border-color:var(--ink);}
  .quick .qi svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .quick .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:900;
    background:linear-gradient(135deg,#F2553F,#D6301F);color:#fff;box-shadow:0 6px 14px rgba(214,48,31,.25);}

  /* OMR 화면 */
  .omr-head{position:sticky;top:0;z-index:10;background:rgba(250,250,248,.94);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:10px 16px;}
  .omr-head .t{font-weight:900;font-size:16px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .omr-head .meta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--dim);margin-top:2px;flex-wrap:wrap;}
  .omr-head .progress{height:3px;background:var(--bg2);margin:8px -16px -10px;}
  .omr-head .progress i{display:block;height:100%;background:var(--red);transition:width .2s;}
  .save-state.saving{color:var(--warn);} .save-state.err{color:var(--red);font-weight:700;}

  .omr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:28px;}
  .q-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line2);}
  .q-row:nth-child(5n){border-bottom:1.5px solid var(--line);}
  .q-row .no{width:34px;flex:0 0 auto;font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;color:var(--ink);}
  .q-row .pts{font-size:11px;color:var(--faint);width:26px;text-align:right;flex:0 0 auto;margin-left:auto;}
  .q-row.blank-flag .no{color:var(--red);}
  .choices{display:flex;gap:8px;}

  .submit-bar{position:sticky;bottom:0;z-index:10;background:linear-gradient(transparent,var(--bg) 30%);
    padding:24px 0 calc(14px + env(safe-area-inset-bottom));margin-top:8px;}
  .locked-banner{background:var(--ink);color:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
  .locked-banner b{display:block;font-size:15px;}
  .locked-banner span{font-size:13px;opacity:.75;}
  .blank-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="../index.html">엄형국 <span>수학</span></a>
    <span class="sub" id="whoami"></span>
  </div>

  <!-- 1. 코드 입력 -->
  <section id="vLogin" class="hidden">
    <div class="kicker">MOBILE OMR</div>
    <h1>모바일 OMR 답안 제출</h1>
    <p class="lead">선생님께 받은 6자리 학생 코드를 입력하세요.</p>
    <div class="card stack">
      <input class="input code-input" id="codeInput" maxlength="6" autocomplete="off" autocapitalize="characters"
             spellcheck="false" inputmode="text" placeholder="ABC123" aria-label="학생 코드">
      <button class="btn primary block" id="loginBtn">입장하기</button>
      <p class="muted" id="loginMsg"></p>
    </div>
  </section>

  <!-- 2. 시험 목록 -->
  <section id="vList" class="hidden">
    <div class="row between" style="margin-bottom:14px;">
      <div>
        <h1 id="helloName"></h1>
        <p class="muted" id="helloClass"></p>
      </div>
      <button class="btn sm" id="logoutBtn">코드 변경</button>
    </div>
    <nav class="quick" aria-label="바로가기">
      <a href="book.html"><span class="qi"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>클리닉 예약</a>
      <a href="lectures.html"><span class="qi"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg></span>영상 강의</a>
      <a href="ask.html"><span class="qi"><svg viewBox="0 0 24 24"><path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4.5 4v-4A1.5 1.5 0 0 1 4 14.5z"/><path d="M10.2 8.4a1.9 1.9 0 1 1 2.6 1.8c-.5.2-.8.6-.8 1.1v.3"/></svg></span>질문하기</a>
      <a href="timer.html"><span class="qi"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v3.5l2.3 1.6M10 3.5h4M18.5 7l1.2-1.2"/></svg></span>타이머</a>
      <a href="#dailyList"><span class="qi"><svg viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5A.5.5 0 0 1 6.5 20V4a.5.5 0 0 1 .5-.5z"/><path d="M9.5 12h5M9.5 15.5h5"/></svg></span>리포트</a>
    </nav>
    <div id="dailyCardBox"></div>
    <div id="weekBox"></div>
    <div id="trendBox"></div>
    <div id="dailyList"></div>
    <div id="todoList"></div>
    <h2 class="sec-h">시험 OMR</h2>
    <div id="examList"><div class="empty">불러오는 중…</div></div>
  </section>

  <!-- 3. OMR 마킹 -->
  <section id="vOmr" class="hidden">
    <div class="omr-head">
      <div class="row between" style="flex-wrap:nowrap;">
        <button class="btn sm ghost" id="backBtn" style="padding-left:0;">← 목록</button>
        <span class="save-state muted" id="saveState"></span>
      </div>
      <div class="t" id="omrTitle"></div>
      <div class="meta"><span id="omrMeta"></span><b id="omrProgress"></b><span id="omrDue"></span></div>
      <div class="progress"><i id="omrBar" style="width:0"></i></div>
    </div>
    <div id="lockedBanner" class="locked-banner hidden"></div>
    <div class="omr-grid" id="omrGrid"></div>
    <div class="submit-bar" id="submitBar">
      <button class="btn red block" id="submitBtn">최종 제출</button>
    </div>
  </section>
</div>

<div class="modal-bg hidden" id="confirmModal">
  <div class="modal">
    <h2>최종 제출할까요?</h2>
    <p class="muted">제출하면 답안을 더 이상 고칠 수 없습니다.</p>
    <div id="confirmBlank"></div>
    <div class="row" style="margin-top:18px;">
      <button class="btn grow" id="confirmNo">계속 풀기</button>
      <button class="btn red grow" id="confirmYes">제출하기</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="common.js?v=7"></script>
<script>
(function(){
  const { db, FV, esc, fmtDateTime, toDate, toast } = OMR;
  const $ = id => document.getElementById(id);
  const views = ['vLogin','vList','vOmr'];
  function show(v){ views.forEach(x => $(x).classList.toggle('hidden', x !== v)); window.scrollTo(0,0); }

  const LS_KEY = 'omrStudentCode';
  const ls = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
    del(k){ try { localStorage.removeItem(k); } catch(e){} },
  };

  let me = null;          // {code, name, className}
  let cur = null;         // {exam, examId, answers, status, submittedAt}
  let saveTimer = null;

  // ───────── 로그인 ─────────
  async function login(code, manual){
    code = (code || '').trim().toUpperCase();
    if (code.length !== 6){ $('loginMsg').textContent = '코드 6자리를 입력하세요.'; return false; }
    $('loginMsg').textContent = '확인 중…';
    try {
      const snap = await db.collection('omrCodes').doc(code).get();
      if (!snap.exists){ $('loginMsg').textContent = '등록되지 않은 코드입니다. 선생님께 확인해 주세요.'; return false; }
      me = { code, ...snap.data() };
      ls.set(LS_KEY, code); ls.set('omrStudentName', me.name || '');
      const next = new URLSearchParams(location.search).get('next');
      if (next && /^[a-z-]+\.html(\?[\w=&%-]*)?$/.test(next)){ location.href = next; return true; }
      // 코드를 직접 입력해 입장하면 메인 화면(내 학습)으로 이동
      if (manual){ try { sessionStorage.setItem('gateChoice', 'student'); } catch(e){} location.href = '../#quick'; return true; }
      $('whoami').textContent = me.name;
      $('loginMsg').textContent = '';
      await loadList();
      return true;
    } catch(e){
      console.error(e);
      $('loginMsg').textContent = '연결에 실패했습니다. 잠시 후 다시 시도하세요.';
      return false;
    }
  }
  $('loginBtn').onclick = () => login($('codeInput').value, true);
  $('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') login(e.target.value, true); });
  $('codeInput').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
  $('logoutBtn').onclick = () => { ls.del(LS_KEY); ls.del('omrStudentName'); me = null; $('whoami').textContent=''; $('codeInput').value=''; show('vLogin'); };

  // ───────── 시험 목록 ─────────
  const STATUS_LABEL = { open:'응시 가능', closed:'마감', published:'성적 공개' };

  async function loadList(){
    show('vList');
    $('helloName').textContent = `${me.name} 학생`;
    $('helloClass').textContent = me.className;
    loadTodos();
    loadDaily();
    loadWeek();
    const box = $('examList');
    box.innerHTML = '<div class="empty">불러오는 중…</div>';
    const qs = await db.collection('omrExams').where('className','==',me.className).get();
    const exams = qs.docs.map(d => ({ id:d.id, ...d.data() }))
      .filter(e => e.status && e.status !== 'draft')
      .sort((a,b) => (toDate(b.createdAt)||0) - (toDate(a.createdAt)||0));
    if (!exams.length){ box.innerHTML = '<div class="empty">아직 응시할 시험이 없습니다.</div>'; return; }
    const subs = await Promise.all(exams.map(e =>
      db.collection('omrSubmissions').doc(`${e.id}_${me.code}`).get().then(s => s.exists ? s.data() : null).catch(() => null)));
    box.innerHTML = '';
    exams.forEach((e, i) => {
      const sub = subs[i];
      let pill, pillCls, action = 'omr';
      if (e.status === 'published' && sub && sub.status === 'submitted'){
        pill = sub.reportToken ? '성적표 보기' : '채점 중'; pillCls = 'published';
        action = sub.reportToken ? 'report' : 'omr';
      } else if (sub && sub.status === 'submitted'){ pill = '제출 완료'; pillCls = 'draft'; }
      else if (e.status === 'open'){ pill = sub ? '이어서 풀기' : '응시 가능'; pillCls = 'open'; }
      else { pill = STATUS_LABEL[e.status] || e.status; pillCls = 'closed'; }
      const el = document.createElement(action === 'report' ? 'a' : 'button');
      el.className = 'exam-item';
      if (action === 'report') el.href = 'report.html?t=' + encodeURIComponent(sub.reportToken);
      else el.onclick = () => openExam(e, sub);
      el.innerHTML = `
        <div>
          <div class="t">${esc(e.title)}</div>
          <div class="m">${esc(e.subject)} · ${e.questionCount}문항 · ${e.choiceCount}지선다${e.examDate ? ' · ' + esc(e.examDate) : ''}</div>
        </div>
        <span class="pill ${pillCls}" style="margin-left:auto;">${pill}</span>`;
      box.appendChild(el);
    });
  }

  // ───────── 데일리 리포트 (최근 5개) ─────────
  async function loadDaily(){
    const box = $('dailyList');
    box.innerHTML = '';
    try {
      const d = await db.collection('dailyReportLinks').doc(me.code).get();
      const items = d.exists ? (d.data().items || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||'')) : [];
      if (!items.length) return;
      const scored = items.filter(x => x.score != null && !x.absent).slice(0, 5).reverse();
      $('trendBox').innerHTML = scored.length ? `<div class="pcard"><div class="ph"><h3>복습 테스트 추이</h3><span>최근 ${scored.length}회</span></div>${trendCard(scored)}</div>` : '';
      // 최신 데일리 리포트 요약 카드
      const latest = items[0];
      const rep0 = await db.collection('dailyReports').doc(latest.token).get().then(x => x.exists ? x.data() : null).catch(() => null);
      if (rep0){
        const weak = rep0.weak || [];
        $('dailyCardBox').innerHTML = `<a class="pcard" href="daily-report.html?t=${encodeURIComponent(latest.token)}">
          <div class="ph"><h3>데일리 리포트</h3><span>${esc(OMR.fmtKDate(rep0.date))}${rep0.title ? ' · ' + esc(rep0.title) : ''}</span></div>
          <div class="dsum">
            ${rep0.attendance === 'absent' ? '<div class="sc" style="font-size:26px;">결석</div>' : rep0.score != null ? `<div class="sc">${rep0.score}<small>/${rep0.maxScore}</small></div>` : ''}
            <div class="info">
              <div class="m">${rep0.avg != null && rep0.score != null ? `반 평균 ${rep0.avg}` : ''}${rep0.homework != null ? `${rep0.avg != null && rep0.score != null ? ' · ' : ''}과제 ${rep0.homework}%` : ''}</div>
              ${weak.length ? `<div class="m" style="margin:2px 0 3px;font-size:12px;">보완할 유형</div><div class="hl">${weak.map(w => `<span>${esc(w)}</span>`).join('')}</div>` : `<div class="ok">${rep0.attendance === 'absent' ? '진도와 과제를 확인해 주세요' : '보완할 유형 없음 👏'}</div>`}
            </div>
          </div></a>`;
      }
      box.insertAdjacentHTML('beforeend', '<h2 class="sec-h">데일리 리포트</h2>');
      items.slice(0, 5).forEach((x, i) => {
        const a = document.createElement('a');
        a.className = 'exam-item'; a.href = 'daily-report.html?t=' + encodeURIComponent(x.token);
        a.innerHTML = `<div><div class="t">${esc(OMR.fmtKDate(x.date))}${x.title ? ' · ' + esc(x.title) : ''}</div>
          <div class="m">${x.absent ? '결석' : x.score != null ? `복습 테스트 ${x.score}/${x.max}점` + (x.avg != null ? ` · 반 평균 ${x.avg}` : '') : '수업 리포트'}</div></div>
          <span class="pill ${i === 0 ? 'published' : 'draft'}" style="margin-left:auto;">${i === 0 ? 'NEW' : '보기'}</span>`;
        box.appendChild(a);
      });
    } catch(e){ console.warn(e); }
  }

  // 최근 5회 복습 테스트 (내 점수 막대 + 반 평균 점선, 백분율)
  function trendCard(list){
    const pct = x => x.max ? x.score / x.max * 100 : x.score;
    const last = list[list.length - 1], prev = list[list.length - 2];
    const diff = prev ? Math.round((pct(last) - pct(prev)) * 10) / 10 : null;
    const W = 320, H = 132, pl = 4, pr = 4, pt = 20, pb = 22, n = list.length;
    const bw = Math.min(52, (W - pl - pr) / n * 0.78);
    const cx = i => pl + (i + 0.5) * (W - pl - pr) / n;
    const y = v => pt + (1 - Math.max(0, Math.min(100, v)) / 100) * (H - pt - pb);
    const avgPts = list.map((x, i) => x.avg != null ? `${cx(i).toFixed(1)},${y(x.max ? x.avg / x.max * 100 : x.avg).toFixed(1)}` : null).filter(Boolean);
    const lab = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? '' : `${t.getMonth()+1}/${t.getDate()}`; };
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 복습 테스트 점수">
      <defs><linearGradient id="tgGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F0805F"/><stop offset="1" stop-color="#D6301F"/></linearGradient></defs>
      <line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(17,17,20,.12)"/>
      ${list.map((x, i) => { const v = pct(x), on = i === n - 1;
        return `<rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0) - y(v)).toFixed(1)}" rx="7" fill="${on ? 'url(#tgGrad)' : '#E4E3DF'}"/>
          <text x="${cx(i).toFixed(1)}" y="${(y(v) - 6).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${on ? '#D6301F' : '#111114'}">${x.score}</text>
          <text x="${cx(i).toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="#63636B">${lab(x.date)}</text>`; }).join('')}
      ${avgPts.length > 1 ? `<polyline points="${avgPts.join(' ')}" fill="none" stroke="#D6301F" stroke-width="1.5" stroke-dasharray="4 4" opacity=".75"/>` : ''}
      ${avgPts.map(p => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="2.5" fill="#fff" stroke="#D6301F" stroke-width="1.5"/>`).join('')}
    </svg>`;
    return `<a class="trend" href="daily-report.html?t=${encodeURIComponent(last.token)}" style="display:block;text-decoration:none;color:inherit;">
      <div class="top"><b>${last.score}</b><small>/ ${last.max}점 · ${esc(OMR.fmtKDate(last.date))}</small>
        ${diff != null && diff !== 0 ? `<span class="chg ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)}%p</span>` : ''}</div>
      ${svg}
      <div class="lg"><span><i style="background:#E4E3DF;height:8px;width:10px;border-radius:2px;"></i>내 점수</span><span><i style="background:repeating-linear-gradient(90deg,#D6301F 0 3px,transparent 3px 6px);"></i>반 평균</span></div></a>`;
  }

  // ───────── 이번 주 할 일 (과제 기한 · 클리닉 예약 · 안 본 영상 · 추가학습 · 열린 시험) ─────────
  async function loadWeek(){
    const box = $('weekBox');
    const now = new Date(), in7 = new Date(now.getTime() + 7 * 864e5), today = OMR.todayStr();
    const rows = [];
    const dLabel = d => { const days = Math.ceil((new Date(d.getFullYear(), d.getMonth(), d.getDate()) - new Date(now.getFullYear(), now.getMonth(), now.getDate())) / 864e5);
      return days < 0 ? '지남' : days === 0 ? '오늘' : 'D-' + days; };
    const safe = p => p.catch(e => { console.warn(e); return null; });
    const [as, slots, lecs, links, exams] = await Promise.all([
      safe(db.collection('omrAssignments').where('className','==',me.className).get()),
      safe(db.collection('clinicSlots').get()),
      safe(db.collection('lectures').get()),
      safe(db.collection('dailyReportLinks').doc(me.code).get()),
      safe(db.collection('omrExams').where('className','==',me.className).get()),
    ]);
    // 과제: 열려 있고 아직 안 낸 것(또는 보완 요청) 중 기한이 7일 안이거나 지난 것
    if (as){
      const list = as.docs.map(d => ({ id:d.id, ...d.data() })).filter(a => a.status === 'open');
      const subs = await Promise.all(list.map(a => db.collection('omrAssignSubs').doc(`${a.id}_${me.code}`).get().then(x => x.exists ? x.data() : null).catch(() => null)));
      list.forEach((a, i) => {
        const st = subs[i] ? subs[i].status : 'none', due = toDate(a.dueAt);
        if (!['none','in_progress','revise'].includes(st)) return;
        if (due && due > in7) return;
        rows.push({ sort: due ? due.getTime() : in7.getTime(), d: due ? dLabel(due) : '과제', cls: !due || due - now < 2 * 864e5 ? 'red' : '',
          t: a.title, m: st === 'revise' ? '보완 필요' : '과제', href: 'hw.html?id=' + encodeURIComponent(a.id) });
      });
    }
    // 클리닉: 앞으로 7일 안에 예약한 시간
    if (slots){
      const up = slots.docs.map(d => ({ id:d.id, ...d.data() }))
        .filter(s => s.date >= today && s.date <= OMR.todayStr(in7) && (s.className === '전체' || s.className === me.className));
      const got = await Promise.all(up.map(s => db.collection('clinicBookings').doc(`${s.id}_${me.code}`).get().then(x => x.exists).catch(() => false)));
      up.forEach((s, i) => { if (!got[i]) return;
        const t = new Date(`${s.date}T${s.start}:00`);
        rows.push({ sort: t.getTime(), d: `${t.getMonth()+1}/${t.getDate()}`, cls:'ink', t: `클리닉 ${s.start}–${s.end}`, m: s.place || '클리닉', href: 'book.html' }); });
    }
    // 추가학습: 가장 최근 리포트에서 추가학습이 필요하다고 했을 때
    if (links && links.exists){
      const last = (links.data().items || []).slice().sort((a,b) => (b.date||'').localeCompare(a.date||''))[0];
      if (last && last.date >= OMR.todayStr(new Date(now.getTime() - 7 * 864e5))){
        const r = await db.collection('dailyReports').doc(last.token).get().then(x => x.exists ? x.data() : null).catch(() => null);
        if (r && r.extra && r.extra.needed) rows.push({ sort: now.getTime() - 1, d: '추가학습', cls:'red', t: r.extra.reason || '추가학습이 필요해요', m: r.extra.when || '', href: 'daily-report.html?t=' + encodeURIComponent(last.token) });
      }
    }
    // 열린 시험 OMR
    if (exams){
      const open = exams.docs.map(d => ({ id:d.id, ...d.data() })).filter(e => e.status === 'open');
      const subs = await Promise.all(open.map(e => db.collection('omrSubmissions').doc(`${e.id}_${me.code}`).get().then(x => x.exists ? x.data() : null).catch(() => null)));
      open.forEach((e, i) => { if (subs[i] && subs[i].status === 'submitted') return;
        const due = toDate(e.dueAt);
        rows.push({ sort: due ? due.getTime() : now.getTime(), d: due ? dLabel(due) : 'OMR', cls:'red', t: e.title, m: '시험 OMR', href: null, exam: e, sub: subs[i] }); });
    }
    // 아직 완강하지 않은 영상 (최근 것 3개)
    if (lecs){
      const mine = lecs.docs.map(d => ({ id:d.id, ...d.data() })).filter(l => l.status === 'open' && (l.className === '전체' || l.className === me.className))
        .sort((a,b) => (toDate(b.createdAt)||0) - (toDate(a.createdAt)||0)).slice(0, 6);
      const vs = await Promise.all(mine.map(l => db.collection('lectureViews').doc(`${l.id}_${me.code}`).get().then(x => x.exists ? x.data() : null).catch(() => null)));
      mine.filter((l, i) => !(vs[i] && vs[i].completed)).slice(0, 3).forEach(l => {
        const v = vs[mine.indexOf(l)];
        rows.push({ sort: in7.getTime() + 1, d: '영상', cls: '', t: l.title, m: v ? Math.round(v.percent) + '% 시청' : '안 봤어요', href: 'watch.html?id=' + encodeURIComponent(l.id) });
      });
    }
    rows.sort((a,b) => a.sort - b.sort);
    box.innerHTML = `<div class="pcard"><div class="ph"><h3>이번 주 할 일</h3><span>${rows.length}개</span></div>
      <div class="wk">${rows.length ? rows.map((r, i) => `<a href="${r.href ? esc(r.href) : '#'}" data-i="${i}"><span class="d ${r.cls}">${esc(r.d)}</span>
        <span class="t">${esc(r.t)}</span><span class="m">${esc(r.m)}</span></a>`).join('') : '<div class="none">이번 주에 남은 할 일이 없어요. 👏</div>'}</div></div>`;
    box.querySelectorAll('a[data-i]').forEach(a => { const r = rows[+a.dataset.i]; if (r.exam) a.onclick = e => { e.preventDefault(); openExam(r.exam, r.sub); }; });
  }

  // ───────── 과제 · 클리닉 학습지 ─────────
  function item(href, title, meta, pill, pillCls){
    const a = document.createElement('a');
    a.className = 'exam-item'; a.href = href;
    a.innerHTML = `<div><div class="t">${esc(title)}</div><div class="m">${meta}</div></div>
      <span class="pill ${pillCls}" style="margin-left:auto;">${pill}</span>`;
    return a;
  }
  let todoSeq = 0;
  async function loadTodos(){
    const seq = ++todoSeq;
    const box = document.createElement('div');   // 다 만든 뒤 한 번에 교체 (중복 표시 방지)
    try {
      const [cs, as] = await Promise.all([db.collection('omrCodes').doc(me.code).get(),
        db.collection('omrAssignments').where('className','==',me.className).get()]);
      const clinicIds = (cs.exists && cs.data().clinics) || [];
      const assigns = as.docs.map(d => ({ id:d.id, ...d.data() }))
        .sort((a,b) => (toDate(a.dueAt) || new Date(8.64e15)) - (toDate(b.dueAt) || new Date(8.64e15)));
      const [aSubs, clinics, cSubs] = await Promise.all([
        Promise.all(assigns.map(a => db.collection('omrAssignSubs').doc(`${a.id}_${me.code}`).get().then(s => s.exists ? s.data() : null).catch(() => null))),
        Promise.all(clinicIds.map(id => db.collection('omrClinics').doc(id).get().then(s => s.exists ? { id, ...s.data() } : null).catch(() => null))),
        Promise.all(clinicIds.map(id => db.collection('omrClinicSubs').doc(id).get().then(s => s.exists ? s.data() : null).catch(() => null))),
      ]);
      // 과제: 마감됐고 이미 끝난 과제는 최근 5개만
      const aRows = assigns.map((a, i) => ({ a, s: aSubs[i] }))
        .filter(({a, s}) => a.status === 'open' || (s && s.status === 'revise'));
      const openIds = new Set(aRows.map(r => r.a.id));
      const doneRows = assigns.map((a, i) => ({ a, s: aSubs[i] })).filter(r => !openIds.has(r.a.id)).slice(0, 5);
      if (aRows.length || doneRows.length){
        box.insertAdjacentHTML('beforeend', '<h2 class="sec-h">과제</h2>');
        [...aRows, ...doneRows].forEach(({a, s}) => {
          const st = s ? s.status : 'none';
          const due = toDate(a.dueAt);
          const [pill, cls] = { none:[a.status === 'open' ? '미제출' : '마감', a.status === 'open' ? 'red' : 'draft'],
            in_progress:['진행 중','closed'], submitted:['제출 완료','draft'], revise:['보완 필요','red'], approved:['확인 완료 ✓','published'] }[st];
          box.appendChild(item(`hw.html?id=${encodeURIComponent(a.id)}`, a.title,
            due ? `기한 ${fmtDateTime(due)}${due < new Date() && st === 'none' ? ' · 지남' : ''}` : '기한 없음', pill, cls));
        });
      }
      const cRows = clinics.map((c, i) => c && { c, s: cSubs[i] }).filter(Boolean)
        .sort((x,y) => (toDate(y.c.createdAt)||0) - (toDate(x.c.createdAt)||0)).slice(0, 8);
      if (cRows.length){
        box.insertAdjacentHTML('beforeend', '<h2 class="sec-h">클리닉 학습지</h2>');
        cRows.forEach(({c, s}) => {
          const [pill, cls] = c.status === 'graded' ? [`결과 ${c.result ? c.result.correct + '/' + c.result.total : ''}`, 'published']
            : s && s.status === 'submitted' ? ['제출 완료','draft'] : s ? ['이어서 풀기','closed'] : ['풀기','open'];
          box.appendChild(item(`solve.html?id=${encodeURIComponent(c.id)}`, c.title, `${c.count}문항 · 틀린 단원 맞춤 문제`, pill, cls));
        });
      }
    } catch(e){ console.error(e); }
    if (seq === todoSeq) $('todoList').replaceChildren(...box.childNodes);
  }

  // ───────── OMR ─────────
  function lsDraftKey(){ return `omrDraft_${cur.examId}_${me.code}`; }

  function openExam(exam, sub){
    const locked = !!sub && sub.status === 'submitted';
    let answers = OMR.normalizeAnswers(sub ? sub.answers : {}, exam.questionCount, exam.choiceCount);
    cur = { exam, examId: exam.id, answers, locked, submittedAt: sub && sub.submittedAt };
    if (!locked && !sub){
      // 서버 저장 전에 네트워크가 끊겼던 경우 기기에 남은 임시 답안 복구
      try {
        const local = JSON.parse(ls.get(lsDraftKey()) || 'null');
        if (local) cur.answers = OMR.normalizeAnswers(local, exam.questionCount, exam.choiceCount);
      } catch(e){}
    }
    $('omrTitle').textContent = exam.title;
    $('omrMeta').textContent = `${exam.subject} · ${exam.questionCount}문항`;
    const due = toDate(exam.dueAt);
    $('omrDue').textContent = due ? `마감 ${fmtDateTime(due)}` : '';
    $('saveState').textContent = locked ? '' : (sub ? `저장됨 ${fmtDateTime(sub.savedAt)}` : '');
    const canEdit = !locked && exam.status === 'open';
    $('submitBar').classList.toggle('hidden', !canEdit);
    const lb = $('lockedBanner');
    if (locked){
      lb.innerHTML = `<b>제출 완료</b><span>${fmtDateTime(cur.submittedAt)} 제출 · 답안은 수정할 수 없습니다. 성적은 선생님이 공개하면 확인할 수 있어요.</span>`;
      lb.classList.remove('hidden');
    } else if (exam.status !== 'open'){
      lb.innerHTML = `<b>응시가 마감된 시험입니다</b><span>답안을 제출할 수 없습니다.</span>`;
      lb.classList.remove('hidden');
    } else lb.classList.add('hidden');
    renderGrid(canEdit);
    show('vOmr');
  }

  function renderGrid(canEdit){
    const { exam } = cur;
    const pts = exam.points || {};
    const grid = $('omrGrid');
    grid.innerHTML = '';
    for (let n = 1; n <= exam.questionCount; n++){
      const row = document.createElement('div');
      row.className = 'q-row';
      row.dataset.n = n;
      let html = `<span class="no">${n}</span><div class="choices">`;
      for (let c = 1; c <= exam.choiceCount; c++){
        const on = cur.answers[n].includes(c);
        html += `<button class="bubble${on?' on':''}" data-c="${c}" ${canEdit?'':'disabled'} aria-label="${n}번 ${c}번 선택">${c}</button>`;
      }
      html += `</div>${pts[n] ? `<span class="pts">${pts[n]}점</span>` : ''}`;
      row.innerHTML = html;
      grid.appendChild(row);
    }
    updateProgress();
  }

  $('omrGrid').addEventListener('click', e => {
    const b = e.target.closest('.bubble');
    if (!b || b.disabled) return;
    const n = +b.closest('.q-row').dataset.n, c = +b.dataset.c;
    // 한 문항에 하나만: 같은 번호 다시 누르면 취소, 다른 번호 누르면 교체
    cur.answers[n] = cur.answers[n][0] === c ? [] : [c];
    b.parentNode.querySelectorAll('.bubble').forEach(x => x.classList.toggle('on', cur.answers[n].includes(+x.dataset.c)));
    b.closest('.q-row').classList.remove('blank-flag');
    if (navigator.vibrate) try { navigator.vibrate(8); } catch(_){}
    updateProgress();
    scheduleSave();
  });

  function answeredCount(){ return Object.values(cur.answers).filter(a => a.length).length; }
  function updateProgress(){
    const q = cur.exam.questionCount, a = answeredCount();
    $('omrProgress').textContent = `${a}/${q} 마킹`;
    $('omrBar').style.width = (a / q * 100) + '%';
  }

  function payload(status){
    const answers = {};
    Object.entries(cur.answers).forEach(([k,v]) => { answers[k] = v; });
    return {
      examId: cur.examId, code: me.code, name: me.name, className: me.className,
      answers, status,
      savedAt: FV.serverTimestamp(),
      submittedAt: status === 'submitted' ? FV.serverTimestamp() : null,
    };
  }

  function scheduleSave(){
    ls.set(lsDraftKey(), JSON.stringify(cur.answers));
    const st = $('saveState');
    st.className = 'save-state saving'; st.textContent = '저장 중…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveDraft, 900);
  }
  async function saveDraft(){
    const st = $('saveState');
    try {
      await db.collection('omrSubmissions').doc(`${cur.examId}_${me.code}`).set(payload('draft'));
      st.className = 'save-state muted'; st.textContent = `임시 저장됨 ${fmtDateTime(new Date())}`;
    } catch(e){
      console.error(e);
      st.className = 'save-state err';
      st.textContent = e.code === 'permission-denied' ? '마감되어 저장할 수 없음' : '저장 실패 · 연결 확인';
    }
  }

  // ───────── 최종 제출 ─────────
  $('submitBtn').onclick = () => {
    const blanks = [];
    for (let n = 1; n <= cur.exam.questionCount; n++) if (!cur.answers[n].length) blanks.push(n);
    document.querySelectorAll('.q-row').forEach(r => r.classList.toggle('blank-flag', blanks.includes(+r.dataset.n)));
    $('confirmBlank').innerHTML = blanks.length
      ? `<p style="margin-top:12px;font-weight:800;color:var(--red);">마킹하지 않은 문항 ${blanks.length}개</p>
         <div class="blank-list">${blanks.map(n => `<span class="pill red">${n}번</span>`).join('')}</div>`
      : `<p style="margin-top:12px;font-weight:700;">모든 문항을 마킹했습니다.</p>`;
    $('confirmModal').classList.remove('hidden');
  };
  $('confirmNo').onclick = () => $('confirmModal').classList.add('hidden');
  $('confirmYes').onclick = async () => {
    const btn = $('confirmYes');
    btn.disabled = true; btn.textContent = '제출 중…';
    clearTimeout(saveTimer);
    try {
      await db.collection('omrSubmissions').doc(`${cur.examId}_${me.code}`).set(payload('submitted'));
      ls.del(lsDraftKey());
      $('confirmModal').classList.add('hidden');
      toast('제출했습니다');
      const snap = await db.collection('omrSubmissions').doc(`${cur.examId}_${me.code}`).get();
      openExam(cur.exam, snap.data());
    } catch(e){
      console.error(e);
      toast(e.code === 'permission-denied' ? '마감되었거나 이미 제출된 시험입니다' : '제출 실패 · 연결을 확인하고 다시 눌러주세요', 3200);
    } finally {
      btn.disabled = false; btn.textContent = '제출하기';
    }
  };

  $('backBtn').onclick = () => { clearTimeout(saveTimer); if ($('saveState').classList.contains('saving')) saveDraft(); loadList(); };

  // ───────── 시작 ─────────
  const params = new URLSearchParams(location.search);
  const saved = params.get('code') || ls.get(LS_KEY);
  if (saved){ $('codeInput').value = saved; login(saved).then(ok => { if (!ok) show('vLogin'); }); }
  else show('vLogin');
})();
</script>
</body>
</html>
