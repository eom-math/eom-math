<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/favicon-64.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엄형국 수학">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="../pwa.js" defer></script>
<title>스터디 플래너 — 엄형국 수학</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="omr.css?v=6">
<style>
  /* 하루 한 장: 위 주간 띠 → D-day·다짐 → 오늘 할 일 → 10분 타임테이블 → 하루 마무리 → 이번 주 */
  :root{
    --paper:#FFFDF8; --cream:#FBF7EE; --dot:rgba(17,17,20,.07);
    --s1:#FF7B63; --s1s:#FFE6DF;   /* 수학 */
    --s2:#F2B92B; --s2s:#FFF3CF;   /* 국어 */
    --s3:#5BB2E0; --s3s:#DDF0FA;   /* 영어 */
    --s4:#5DBE7E; --s4s:#DFF4E6;   /* 탐구 */
    --s5:#A88BE8; --s5s:#EEE6FC;   /* 기타 */
    --hand:'Gaegu','Pretendard',cursive;
  }
  body{background:var(--bg);}
  .wrap{max-width:560px;padding-bottom:90px;}
  .topbar{margin-bottom:12px;}
  .save{font-size:11.5px;color:var(--faint);font-weight:700;}
  .save.err{color:var(--red);}

  /* 헤더 · 주간 띠 */
  .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:2px 2px 10px;}
  .hd .t{font-family:var(--hand);font-size:30px;font-weight:700;line-height:1;letter-spacing:-.01em;}
  .hd .t small{font-family:'Pretendard',sans-serif;font-size:13px;color:var(--dim);font-weight:700;margin-left:6px;letter-spacing:0;}
  .navs{display:flex;gap:4px;}
  .navs button{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--dim);}
  .navs button.today{width:auto;padding:0 10px;font-size:12px;}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 6px 8px;margin-bottom:12px;}
  .day{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px 0;border-radius:12px;position:relative;}
  .day .w{font-size:11px;font-weight:800;color:var(--faint);}
  .day.sun .w{color:var(--s1);} .day.sat .w{color:var(--s3);}
  .ring{position:relative;width:38px;height:38px;}
  .ring svg{width:38px;height:38px;transform:rotate(-90deg);}
  .ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:13.5px;font-weight:800;font-variant-numeric:tabular-nums;}
  .ring .stk{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;}
  .day.on .ring .n{color:#fff;}
  .day.on .ring .bg{fill:var(--ink);}
  .day .mn{font-size:10px;color:var(--faint);font-weight:700;height:12px;font-variant-numeric:tabular-nums;}
  .day.today::after{content:"";position:absolute;bottom:-4px;width:4px;height:4px;border-radius:50%;background:var(--red);}

  .card2{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;position:relative;}
  .ctitle{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin-bottom:12px;letter-spacing:-.02em;}
  .ctitle .em{font-size:17px;}
  .ctitle .r{margin-left:auto;font-size:12px;font-weight:700;color:var(--dim);}

  /* D-day · 다짐 */
  .top2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;margin-bottom:12px;}
  .dday{border:0;border-radius:20px;padding:14px 16px;min-width:108px;text-align:left;color:#fff;
    background:linear-gradient(140deg,#FF8A6A,#E8432F);box-shadow:0 8px 18px rgba(232,67,47,.22);}
  .dday .k{font-size:11px;font-weight:800;opacity:.85;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dday .v{font-size:28px;font-weight:900;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;}
  .dday.empty{background:#fff;color:var(--dim);border:1.5px dashed var(--line);box-shadow:none;}
  .dday.empty .v{font-size:15px;font-weight:800;color:var(--ink);margin-top:4px;}
  .pledge{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:12px 14px;
    background-image:radial-gradient(var(--dot) 1px, transparent 1px);background-size:12px 12px;}
  .pledge label{font-size:11px;font-weight:800;color:var(--dim);display:flex;align-items:center;gap:4px;}
  .pledge input{width:100%;border:0;background:transparent;font-family:var(--hand);font-size:22px;font-weight:700;color:var(--ink);outline:none;padding:2px 0 0;}
  .pledge input::placeholder{color:#C8C6BF;}

  /* 할 일 */
  .prog{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;}
  .prog .bar{flex:1;height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;}
  .prog .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF9C7F,#E8432F);transition:width .4s cubic-bezier(.2,.8,.2,1);}
  .prog b{font-size:13px;font-variant-numeric:tabular-nums;}
  .grp{margin-bottom:10px;}
  .grp-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;margin:4px 0 4px;}
  .grp-h i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .todo{display:flex;align-items:center;gap:10px;padding:9px 6px 9px 4px;border-radius:12px;transition:background .15s;}
  .todo:hover{background:var(--cream);}
  .chk{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:2px solid var(--sc);background:#fff;display:grid;place-items:center;
    color:#fff;font-size:15px;font-weight:900;transition:transform .15s, background .15s;}
  .chk:active{transform:scale(.85);}
  .todo.done .chk{background:var(--sc);}
  .todo.done .chk::after{content:"✓";}
  .todo.pop .chk{animation:pop .35s ease;}
  @keyframes pop{40%{transform:scale(1.25) rotate(-8deg);}100%{transform:scale(1);}}
  .todo .tx{flex:1;min-width:0;font-size:15px;font-weight:600;word-break:keep-all;line-height:1.35;}
  .todo .tx .am{font-size:12px;color:var(--dim);font-weight:700;margin-left:4px;}
  .todo .tx .tg{font-size:10.5px;font-weight:800;color:var(--red);background:var(--red-soft);padding:1px 6px;border-radius:99px;margin-left:4px;vertical-align:1px;}
  .todo.done .tx{color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(17,17,20,.3);}
  .todo .star{border:0;background:none;font-size:16px;opacity:.25;padding:2px;}
  .todo .star.on{opacity:1;}
  .todo .more{border:0;background:none;color:var(--faint);font-size:18px;padding:2px 4px;line-height:1;}
  .menu{position:absolute;z-index:30;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(17,17,20,.14);padding:4px;min-width:150px;}
  .menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;font-size:13.5px;font-weight:600;border-radius:8px;}
  .menu button:hover{background:var(--bg2);}
  .menu .del{color:var(--red);}
  .add{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:12px;border-top:1px dashed var(--line);}
  .add .row1{display:flex;gap:6px;}
  .add input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:15px;background:var(--paper);outline:none;}
  .add input:focus{border-color:var(--ink);}
  .add input.am{flex:0 0 84px;font-size:13px;}
  .add .go{border:0;border-radius:12px;background:var(--ink);color:#fff;font-weight:900;font-size:20px;width:46px;}
  .subs{display:flex;gap:6px;flex-wrap:wrap;}
  .sub{border:1.5px solid transparent;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:800;background:var(--ss);color:var(--sc);}
  .sub.on{border-color:var(--sc);background:#fff;}
  .empty-todo{text-align:center;padding:14px 0 6px;color:var(--dim);font-size:13.5px;}
  .empty-todo .big{font-size:34px;display:block;margin-bottom:4px;}
  .stamp{position:absolute;right:66px;top:-18px;width:66px;height:66px;border-radius:50%;border:3px solid #E8432F;color:#E8432F;
    display:grid;place-items:center;text-align:center;font-family:var(--hand);font-weight:700;font-size:15px;line-height:1.05;transform:rotate(-14deg);
    opacity:.88;pointer-events:none;background:rgba(255,255,255,.6);}
  .stamp.show{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1);}
  @keyframes stampIn{from{transform:rotate(-14deg) scale(2.2);opacity:0;}to{transform:rotate(-14deg) scale(1);opacity:.88;}}

  /* 선생님이 낸 할 일 */
  .tsg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;}
  .tsg::-webkit-scrollbar{display:none;}
  .tsg .it{flex:0 0 auto;max-width:230px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 10px;background:var(--cream);}
  .tsg .d{font-size:10.5px;font-weight:900;color:var(--red);background:var(--red-soft);padding:3px 6px;border-radius:6px;flex:0 0 auto;}
  .tsg .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tsg button{flex:0 0 auto;border:0;border-radius:9px;background:var(--ink);color:#fff;font-weight:900;width:28px;height:28px;}
  .tsg .it.added button{background:var(--ok);}

  /* 10분 타임테이블 */
  .tt-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .tt-head .tot{margin-left:auto;font-size:13px;font-weight:800;}
  .tt-head .tot b{font-size:18px;color:var(--red);font-variant-numeric:tabular-nums;}
  .paint{display:flex;gap:6px;flex-wrap:wrap;}
  .paint button{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px 6px 7px;font-size:13px;font-weight:800;color:var(--ink);transition:transform .12s, background .15s;}
  .paint button i{width:16px;height:16px;border-radius:5px;background:var(--sc);display:inline-block;}
  .paint button.on{background:var(--sc);border-color:var(--sc);color:#fff;transform:scale(1.04);box-shadow:0 4px 10px rgba(17,17,20,.12);}
  .paint button.on i{background:#fff;opacity:.9;}
  .paint button.er i{background:repeating-linear-gradient(45deg,#ddd 0 3px,#fff 3px 6px);border:1px solid var(--line);}
  .paint button.er.on{background:var(--ink);border-color:var(--ink);}
  .paint.shake{animation:shake .4s;}
  @keyframes shake{20%,60%{transform:translateX(-5px);}40%,80%{transform:translateX(5px);}}
  .tt-state{font-size:12.5px;font-weight:700;color:var(--dim);margin:8px 0 10px;min-height:20px;line-height:1.5;}
  .tt-state b{color:var(--ink);}
  .tt-state .dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px;}
  .tt{display:grid;grid-template-columns:30px repeat(6,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:auto;transition:box-shadow .2s;}
  .tt.armed{touch-action:none;box-shadow:0 0 0 2px var(--armc, var(--ink));}
  .tt.armed .c{cursor:crosshair;}
  .tt .h{font-size:10.5px;font-weight:800;color:var(--dim);display:grid;place-items:center;background:var(--cream);border-top:1px solid var(--line2);font-variant-numeric:tabular-nums;}
  .tt .c{height:22px;border-top:1px solid var(--line2);border-left:1px solid var(--line2);background:#fff;transition:background .1s;}
  .tt .c:nth-child(7n+4){border-left:1px dashed rgba(17,17,20,.14);}
  .tt .h:first-child,.tt .c.r0{border-top:0;}
  .tt-hint{font-size:11.5px;color:var(--dim);margin-top:8px;}
  .bysub{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;font-weight:700;}
  .bysub span{display:flex;align-items:center;gap:4px;} .bysub i{width:9px;height:9px;border-radius:3px;}

  /* 하루 마무리 */
  .stks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:10px;}
  .stks button{border:0;background:var(--cream);border-radius:12px;font-size:22px;padding:6px 0;transition:transform .15s;}
  .stks button.on{background:#FFE9E2;box-shadow:0 0 0 2px var(--red) inset;transform:scale(1.06);}
  .fb{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:76px;resize:vertical;font-family:var(--hand);font-size:19px;
    line-height:1.45;background:var(--paper);outline:none;background-image:linear-gradient(transparent 26px, rgba(17,17,20,.06) 27px);background-size:100% 27.5px;}
  .fb:focus{border-color:var(--ink);}

  /* 이번 주 */
  .wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .wsum > div{background:var(--cream);border-radius:14px;padding:10px 10px;min-width:0;}
  .wsum .l{font-size:11px;color:var(--dim);font-weight:800;white-space:nowrap;}
  .wsum .v{white-space:nowrap;font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .wsum .v small{font-size:10.5px;color:var(--dim);font-weight:700;margin-left:1px;}
  .wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:96px;}
  .wbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;}
  .wbars i{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:#ECEAE4;min-height:3px;}
  .wbars i.t{background:linear-gradient(#FF9C7F,#E8432F);}
  .wbars span{font-size:10.5px;color:var(--dim);font-weight:800;}
  .wbars em{font-style:normal;font-size:10px;color:var(--faint);font-weight:700;font-variant-numeric:tabular-nums;height:12px;}

  .tnote{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1.5px solid #FFD2C6;border-radius:20px;padding:14px 16px;margin-bottom:12px;position:relative;}
  .tnote[hidden]{display:none;}
  .na{background:#fff;border:1.5px solid #E8432F;border-radius:18px;padding:12px 14px;margin:0 0 12px;box-shadow:0 6px 18px rgba(232,67,47,.12);animation:naIn .4s ease;}
  .na[hidden]{display:none;}
  @keyframes naIn{from{transform:translateY(-6px);opacity:0;}to{transform:none;opacity:1;}}
  .na-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .na-h .bell{font-size:18px;animation:ring 1.6s ease 2;transform-origin:50% 10%;display:inline-block;}
  @keyframes ring{0%,100%{transform:rotate(0);}10%{transform:rotate(16deg);}20%{transform:rotate(-14deg);}30%{transform:rotate(10deg);}40%{transform:rotate(-6deg);}50%{transform:rotate(0);}}
  .na-h b{font-size:14.5px;font-weight:900;}
  .na-n{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:99px;background:#E8432F;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;}
  .na-i{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:#FFF5F1;border-radius:12px;padding:9px 11px;margin-top:5px;}
  .na-i .ic{font-size:17px;} .na-i .d{font-size:12px;font-weight:800;color:var(--dim);white-space:nowrap;}
  .na-i .t{flex:1;min-width:0;font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .na-i .go{font-size:12px;font-weight:800;color:#E8432F;white-space:nowrap;}
  .newb{display:inline-block;font-size:10px;font-weight:900;color:#fff;background:#E8432F;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:1px;}
  .tnote .st{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#FFF1EC;}
  .tnote .k{font-size:11px;font-weight:800;color:var(--red);letter-spacing:.04em;}
  .tnote .x{font-family:var(--hand);font-size:20px;font-weight:700;line-height:1.35;word-break:keep-all;}
  .tnote .by{font-size:11.5px;color:var(--dim);margin-top:2px;}
  /* 완료한 하루 */
  .closedbar{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#FFF1EC,#fff);border:1.5px solid #FFD2C6;border-radius:16px;padding:11px 14px;margin-bottom:12px;}
  .closedbar[hidden]{display:none;}
  .closedbar .ic{font-size:24px;}
  .closedbar b{font-size:14.5px;} .closedbar span{display:block;font-size:12px;color:var(--dim);}
  .closedbar button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:800;}
  .sv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#111114;color:#fff;border-radius:14px;padding:11px 14px;margin:0 0 14px;font-size:13px;}
  .sv-bar .sv-k{font-size:11px;font-weight:900;background:#E8432F;padding:3px 8px;border-radius:6px;letter-spacing:.04em;}
  .sv-bar b{font-size:15px;} .sv-bar span{color:rgba(255,255,255,.7);}
  .sv-bar a{margin-left:auto;color:#fff;font-weight:800;text-decoration:none;font-size:12.5px;}
  body.staff-view .dday{pointer-events:none;} body.staff-view #pledge{background:transparent;}
  body.locked .add, body.locked .more, body.locked .star:not(.on), body.locked #tsgCard, body.locked .paint, body.locked .tt-state{display:none !important;}
  body.locked .chk, body.locked .stks button{pointer-events:none;}
  body.locked .stks button:not(.on){opacity:.35;}
  .finish{width:100%;border:0;border-radius:18px;padding:17px;margin:4px 0 12px;font-size:17px;font-weight:900;color:#fff;letter-spacing:-.01em;
    background:linear-gradient(135deg,#FF8A6A,#E8432F);box-shadow:0 10px 22px rgba(232,67,47,.28);transition:transform .15s;}
  .finish:active{transform:scale(.98);}
  .finish small{display:block;font-size:12px;font-weight:700;opacity:.85;margin-top:2px;}
  .finish[hidden]{display:none;}
  .sumcard{background:var(--paper);border-radius:16px;padding:14px;margin:10px 0;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:12px 12px;}
  .sumcard .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;}
  .sumcard .row3 b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;}
  .sumcard .row3 span{font-size:11.5px;color:var(--dim);font-weight:700;}
  .warnline{font-size:12.5px;color:var(--warn);font-weight:700;margin-top:6px;}
  .day .ok{position:absolute;right:2px;top:14px;width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;font-weight:900;display:grid;place-items:center;border:1.5px solid #fff;}

  /* 공부 기록 (주간·월간) */
  .seg{display:inline-flex;background:var(--bg2);border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:800;color:var(--dim);}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(17,17,20,.1);}
  .st-nav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px;}
  .st-nav b{font-size:15px;}
  .st-nav button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:800;color:var(--dim);}
  .cmp{font-size:12.5px;font-weight:700;color:var(--dim);margin:-4px 0 12px;}
  .cmp b.up{color:var(--ok);} .cmp b.down{color:var(--red);}
  .sbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;margin-bottom:6px;}
  .sbars .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .sbars .stack{width:100%;max-width:32px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;min-height:3px;background:#ECEAE4;}
  .sbars .stack i{display:block;width:100%;}
  .sbars em{font-style:normal;font-size:10px;color:var(--dim);font-weight:800;height:12px;font-variant-numeric:tabular-nums;}
  .sbars span{font-size:10.5px;color:var(--dim);font-weight:800;}
  .sbars .col.today span{color:var(--red);}
  .share{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--bg2);margin:10px 0 8px;}
  .share i{display:block;height:100%;}
  .slist{display:grid;grid-template-columns:1fr;gap:5px;font-size:13px;}
  .slist div{display:flex;align-items:center;gap:6px;} .slist i{width:9px;height:9px;border-radius:3px;}
  .slist b{margin-left:auto;font-variant-numeric:tabular-nums;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal .dw{font-size:10.5px;text-align:center;color:var(--faint);font-weight:800;padding-bottom:2px;}
  .cal .dw:first-child{color:inherit;}
  .cal .cd{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;position:relative;border:0;background:#F4F2EC;color:var(--ink);font-variant-numeric:tabular-nums;}
  .cal .cd small{font-size:9px;font-weight:700;opacity:.8;}
  .cal .cd .sk{position:absolute;right:-2px;top:-5px;font-size:12px;}
  .cal .cd.l1{background:#FFE6DF;} .cal .cd.l2{background:#FFC4B5;} .cal .cd.l3{background:#FF9C7F;color:#fff;} .cal .cd.l4{background:#E8432F;color:#fff;}
  .cal .cd.out{visibility:hidden;}
  .cal .cd.td{box-shadow:0 0 0 2px var(--ink);}
  .cal .cd.fut{opacity:.45;}
  .heat{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:10.5px;color:var(--dim);margin-top:8px;}
  .heat i{width:12px;height:12px;border-radius:3px;display:inline-block;}
  .notice{background:var(--warn-soft);color:#7A4E0E;border-radius:14px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.5;}
  .notice[hidden]{display:none;}

  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .confetti{position:fixed;left:50%;top:40%;pointer-events:none;z-index:100;}
  .confetti span{position:absolute;font-size:20px;animation:fly 1.1s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .confetti{display:none;} .stamp.show,.todo.pop .chk{animation:none;} }

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="common.js?v=24"></script>
<script>
(async function(){
  const { db, FV, esc, toast } = OMR;
  const $ = id => document.getElementById(id);
  // 선생님·조교 보기: planner.html?view=학생코드&d=날짜 → 그 학생 플래너를 읽기 전용으로
  const QS = new URLSearchParams(location.search);
  const VIEW = (QS.get('view') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (VIEW) document.body.dataset.back = 'study.html';
  const me = VIEW ? await OMR.studentByCode(VIEW).catch(() => null) : await OMR.requireStudent();
  if (VIEW && !me){ document.querySelector('.wrap').insertAdjacentHTML('beforeend', '<div class="empty">학생을 찾을 수 없어요.</div>'); return; }
  if (!me) return;
  if (VIEW){
    document.body.classList.add('staff-view');
    document.title = `${me.name} 플래너 — 선생님 보기`;
    document.querySelector('.hd').insertAdjacentHTML('beforebegin', `<div class="sv-bar"><span class="sv-k">선생님 보기</span><b>${esc(me.name)}</b><span>${esc(me.className)} · 읽기 전용</span><a href="study.html#board">플래너 관리 →</a></div>`);
  }
  const SUBJ = [
    { k:'1', name:'수학', c:'var(--s1)', s:'var(--s1s)', hex:'#FF7B63' },
    { k:'2', name:'국어', c:'var(--s2)', s:'var(--s2s)', hex:'#F2B92B' },
    { k:'3', name:'영어', c:'var(--s3)', s:'var(--s3s)', hex:'#5BB2E0' },
    { k:'4', name:'탐구', c:'var(--s4)', s:'var(--s4s)', hex:'#5DBE7E' },
    { k:'5', name:'기타', c:'var(--s5)', s:'var(--s5s)', hex:'#A88BE8' },
  ];
  const sub = k => SUBJ.find(s => s.k === k) || SUBJ[0];
  const STICKERS = ['🌱','🔥','⭐','🍀','💯','🐣','😴','🥲'];
  const H0 = 6, ROWS = 20, CELLS = ROWS * 6;            // 06:00 ~ 다음날 02:00, 10분 칸
  const DOW = '일월화수목금토';
  const pad = n => String(n).padStart(2, '0');
  const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => new Date(s + 'T00:00:00');
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ds(d); };
  const monday = s => { const d = parse(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return ds(d); };
  let today = OMR.todayStr();
  const fmtShort = m => m >= 60 ? Math.floor(m / 60) + 'h' + (m % 60 ? m % 60 : '') : m + 'm';
  const uid = () => Math.random().toString(36).slice(2, 9);

  let cur = today, docs = {}, meta = { dday: null }, curSubj = '1', paintSubj = null, remoteOk = true;
  const LKEY = d => `planner_${me.code}_${d}`;
  const local = { get(d){ try { return JSON.parse(localStorage.getItem(LKEY(d))); } catch(e){ return null; } },
                  set(d, v){ try { localStorage.setItem(LKEY(d), JSON.stringify(v)); } catch(e){} } };
  const blank = d => ({ code: me.code, name: me.name, className: me.className, date: d, pledge:'', todos:[], tdone:[], ttodos:[], grid:'0'.repeat(CELLS), feedback:'', sticker:'', studyMin:0, done:0, total:0 });

  async function load(d){
    if (docs[d]) return docs[d];
    let v = null;
    try { const s = await db.collection('planners').doc(`${me.code}_${d}`).get(); if (s.exists) v = s.data(); }
    catch(e){ remoteOk = false; }
    const l = local.get(d);
    if (!v && l) v = l;
    docs[d] = { ...blank(d), ...(v || {}) };
    if ((docs[d].grid || '').length !== CELLS) docs[d].grid = (docs[d].grid || '').padEnd(CELLS, '0').slice(0, CELLS);
    const sm = OMR.plannerTodos(docs[d]); docs[d].done = sm.done; docs[d].total = sm.total;
    return docs[d];
  }

  // ───── 저장 (0.6초 모아서) ─────
  const timers = {};
  function save(d){
    if (VIEW) return;                                   // 선생님 보기에서는 저장하지 않음
    const doc = docs[d];
    const sm = OMR.plannerTodos(doc); doc.done = sm.done; doc.total = sm.total;
    doc.tdone = (doc.tdone || []).filter(id => (doc.ttodos || []).some(t => t.id === id));
    doc.studyMin = [...doc.grid].filter(c => c !== '0').length * 10;
    local.set(d, doc);
    $('saveState').textContent = '저장 중…'; $('saveState').className = 'save';
    clearTimeout(timers[d]);
    timers[d] = setTimeout(async () => {
      try {
        await db.collection('planners').doc(`${me.code}_${d}`).set({
          code: me.code, name: me.name, className: me.className, date: d,
          pledge: doc.pledge.slice(0, 60), todos: doc.todos.slice(0, 40).map(t => ({ id: t.id, text: String(t.text).slice(0, 80), subj: t.subj, amount: (t.amount || '').slice(0, 20), done: !!t.done, star: !!t.star, from: t.from || '' })),
          grid: doc.grid, feedback: doc.feedback.slice(0, 300), sticker: doc.sticker || '',
          studyMin: doc.studyMin, done: doc.done, total: doc.total, tdone: doc.tdone.slice(0, 40), closed: !!doc.closed, closedAuto: !!doc.closedAuto, updatedAt: FV.serverTimestamp() }, { merge: true });
        $('saveState').textContent = '저장됨 ✓';
        $('notice').hidden = true;
      } catch(e){
        console.warn(e);
        $('saveState').textContent = '이 기기에만 저장됨'; $('saveState').className = 'save err';
        $('notice').hidden = false;
        $('notice').textContent = '지금은 플래너가 이 기기에만 저장돼요. 선생님이 저장 설정을 마치면 다른 기기에서도 볼 수 있어요.';
      }
    }, 600);
  }

  // ───── 주간 띠 ─────
  function ringSvg(p, on){
    const R = 16, C = 2 * Math.PI * R;
    return `<svg viewBox="0 0 38 38"><circle class="bg" cx="19" cy="19" r="${on ? 15 : 0}" /><circle cx="19" cy="19" r="${R}" fill="none" stroke="#EFEDE7" stroke-width="3.5"/>
      <circle cx="19" cy="19" r="${R}" fill="none" stroke="${p >= 1 ? '#E8432F' : '#FF9C7F'}" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - p)}"/></svg>`;
  }
  async function renderWeek(){
    const m = monday(cur);
    const days = [...Array(7)].map((_, i) => addDays(m, i));
    await Promise.all(days.map(load));
    $('week').innerHTML = days.map(d => {
      const x = docs[d], dt = parse(d), p = x.total ? x.done / x.total : 0;
      const cls = ['day', d === cur ? 'on' : '', d === today ? 'today' : '', dt.getDay() === 0 ? 'sun' : '', dt.getDay() === 6 ? 'sat' : ''].join(' ');
      const center = x.sticker ? `<span class="stk">${x.sticker}</span>` : (x.total && x.done === x.total ? '<span class="stk">💮</span>' : `<span class="n">${dt.getDate()}</span>`);
      return `<button class="${cls}" data-d="${d}"><span class="w">${DOW[dt.getDay()]}</span><span class="ring">${ringSvg(p, d === cur)}${center}${x.closed ? '<span class="ok">✓</span>' : ''}</span>
        <span class="mn">${x.studyMin ? fmtShort(x.studyMin) : ''}</span></button>`;
    }).join('');
    $('week').querySelectorAll('.day').forEach(b => b.onclick = () => go(b.dataset.d));
    if (stMode === 'w' && stAnchor !== monday(cur)){ stAnchor = monday(cur); renderStats(); }
  }
  async function renderStreak(){
    // 오늘(또는 어제)부터 거꾸로, 공부했거나 할 일을 끝낸 날이 이어진 일수
    const past = [...Array(30)].map((_, i) => addDays(today, -i));
    await Promise.all(past.map(load));
    const active = d => docs[d] && (docs[d].studyMin > 0 || docs[d].done > 0);
    let i = active(today) ? 0 : 1, n = 0;
    while (i < past.length && active(past[i])){ n++; i++; }
    refreshAlarm();
    $('streak').innerHTML = n ? `🔥 <b style="color:var(--red);">${n}일</b> 연속 기록 중이에요` : '오늘 기록하면 연속 기록이 시작돼요';
  }

  // ───── 하루 화면 ─────
  const hasContent = x => !!(x && ((x.todos || []).length || (x.ttodos || []).length || x.studyMin || x.pledge || x.feedback || x.sticker));
  const isLocked = d => !!VIEW || d < today || !!(docs[d] && docs[d].closed);
  async function go(d){
    cur = d;
    await load(d);
    // 지난날은 자정이 지나면 자동 완료
    if (d < today && hasContent(docs[d]) && !docs[d].closed){ docs[d].closed = true; docs[d].closedAuto = true; save(d); }
    const dt = parse(d);
    $('hdTitle').innerHTML = `${dt.getMonth() + 1}월 ${dt.getDate()}일<small>${DOW[dt.getDay()]}요일${d === today ? ' · 오늘' : ''}</small>`;
    renderWeek(); renderDay();
  }
  function renderDay(){
    const x = docs[cur];
    const locked = isLocked(cur);
    document.body.classList.toggle('locked', locked);
    $('pledge').readOnly = locked; $('fb').readOnly = locked;
    if (locked && paintSubj){ paintSubj = null; renderPaint(); }
    const cb = $('closedBar');
    if (VIEW && !x.closed && hasContent(x) && cur >= today){
      cb.hidden = false;
      cb.innerHTML = `<span class="ic">✏️</span><div><b>${cur === today ? '오늘 작성 중인 플래너예요' : '미리 적어 둔 플래너예요'}</b><span>${x.done}/${x.total} 완료 · ${fmtShort(x.studyMin || 0)} 공부${x.sticker ? ' · ' + x.sticker : ''}</span></div>`;
    } else if (locked && (x.closed || hasContent(x))){
      cb.hidden = false;
      cb.innerHTML = `<span class="ic">${x.closedAuto || !x.closed ? '🌙' : '✅'}</span><div><b>${x.closedAuto || !x.closed ? '자정에 자동으로 완료된 하루예요' : '완료한 하루예요'}</b><span>${x.done}/${x.total} 완료 · ${fmtShort(x.studyMin || 0)} 공부${x.sticker ? ' · ' + x.sticker : ''}</span></div>${cur === today && !VIEW ? '<button id="reopen">다시 열기</button>' : ''}`;
      const ro = $('reopen'); if (ro) ro.onclick = () => { docs[cur].closed = false; docs[cur].closedAuto = false; save(cur); renderDay(); renderWeek(); toast('다시 쓸 수 있어요'); };
    } else if (locked){ cb.hidden = false; cb.innerHTML = `<span class="ic">📭</span><div><b>기록이 없는 날이에요</b><span>${VIEW ? '아직 이 날 플래너를 쓰지 않았어요' : '지난 날짜는 볼 수만 있어요'}</span></div>`; }
    else cb.hidden = true;
    $('finishBtn').hidden = !(cur === today && !locked);
    $('pledge').value = x.pledge || '';
    $('fb').value = x.feedback || '';
    $('stks').innerHTML = STICKERS.map(s => `<button class="${x.sticker === s ? 'on' : ''}" data-s="${s}" aria-label="스티커 ${s}">${s}</button>`).join('');
    renderTodos(); renderTT();
  }
  $('pledge').addEventListener('input', e => { docs[cur].pledge = e.target.value; save(cur); });
  $('fb').addEventListener('input', e => { docs[cur].feedback = e.target.value; save(cur); });
  $('stks').onclick = e => { const b = e.target.closest('button'); if (!b || isLocked(cur)) return;
    docs[cur].sticker = docs[cur].sticker === b.dataset.s ? '' : b.dataset.s; save(cur); renderDay(); renderWeek(); };

  // ───── 선생님 도장·코멘트 ─────
  const STAMP = { good:['👍','확인했어요'], best:['💯','최고예요'], fire:['🔥','조금 더 힘내요'], heart:['💖','응원해요'] };
  function renderTeacherNote(x){
    const box = $('tnote');
    if (!x.tstamp && !x.tcomment){ box.hidden = true; return; }
    const st = STAMP[x.tstamp];
    box.hidden = false;
    const fresh = !VIEW && OMR.plannerSeen(me.code)[cur] !== OMR.noteSig(x);
    box.innerHTML = `<div class="st">${st ? st[0] : '✏️'}</div><div><div class="k">선생님 코멘트${fresh ? ' <span class="newb">NEW</span>' : ''}</div>
      <div class="x">${x.tcomment ? esc(x.tcomment) : (st ? st[1] : '')}</div><div class="by">${esc(x.tby || '선생님')}</div></div>`;
    if (!VIEW){ OMR.markPlannerSeen(me.code, { ...x, date: cur }); if (fresh){ alarmList = alarmList.filter(n => n.date !== cur); renderAlarm(); } }
  }
  // ───── 새 코멘트 알림 (맨 위) ─────

      const lv = v => !v ? '' : v < 60 ? 'l1' : v < 180 ? 'l2' : v < 300 ? 'l3' : 'l4';
      const lead = (parse(first).getDay() + 6) % 7;
      $('stLabel').textContent = `${y}년 ${m}월`;
      body.innerHTML = `<div class="wsum">
          <div><div class="l">공부 시간</div><div class="v">${Math.floor(mins / 60)}<small>시간</small> ${mins % 60}<small>분</small></div></div>
          <div><div class="l">공부한 날</div><div class="v">${act}<small>일</small></div></div>
          <div><div class="l">최장 연속</div><div class="v">${bestRun}<small>일</small></div></div></div>
        <div class="cmp">할 일 달성률 <b style="color:var(--ink);">${tot ? Math.round(dn / tot * 100) : 0}%</b> · 공부한 날 하루 평균 <b style="color:var(--ink);">${act ? fmtLong(Math.round(mins / act / 10) * 10) : '0분'}</b></div>
        <div class="cal">${'월화수목금토일'.split('').map(w => `<div class="dw">${w}</div>`).join('')}
          ${'<div class="cd out"></div>'.repeat(lead)}
          ${xs.map(x => `<button class="cd ${lv(x.studyMin)} ${x.date === today ? 'td' : ''} ${x.date > today ? 'fut' : ''}" data-d="${x.date}" title="${x.date} ${fmtLong(x.studyMin)}">
            ${+x.date.slice(8)}${x.studyMin ? `<small>${fmtShort(x.studyMin)}</small>` : ''}${x.sticker ? `<span class="sk">${x.sticker}</span>` : ''}</button>`).join('')}</div>
        <div class="heat">적게 <i style="background:#F4F2EC"></i><i style="background:#FFE6DF"></i><i style="background:#FFC4B5"></i><i style="background:#FF9C7F"></i><i style="background:#E8432F"></i> 많이</div>
        ${subjBlock(totals)}`;
      body.querySelectorAll('.cd[data-d]').forEach(b => b.onclick = () => { go(b.dataset.d); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    }
  }
  $('stMode').onclick = e => { const b = e.target.closest('button'); if (!b) return; stMode = b.dataset.v;
    [...$('stMode').children].forEach(x => x.classList.toggle('on', x === b));
    stAnchor = stMode === 'w' ? monday(cur) : cur.slice(0, 7) + '-01'; renderStats(); };
  $('stPrev').onclick = () => { stAnchor = stMode === 'w' ? addDays(stAnchor, -7) : (() => { const d = parse(stAnchor); d.setMonth(d.getMonth() - 1); return ds(d); })(); renderStats(); };
  $('stNext').onclick = () => { stAnchor = stMode === 'w' ? addDays(stAnchor, 7) : (() => { const d = parse(stAnchor); d.setMonth(d.getMonth() + 1); return ds(d); })(); renderStats(); };

  // ───── D-day ─────
  async function loadMeta(){
    try { const s = await db.collection('plannerMeta').doc(me.code).get(); if (s.exists) meta = { ...meta, ...s.data() }; } catch(e){}
    if (!meta.dday){ try { const l = JSON.parse(localStorage.getItem('plannerMeta_' + me.code)); if (l) meta = { ...meta, ...l }; } catch(e){} }
    renderDday();
  }
  function renderDday(){
    const b = $('ddayBtn'), dd = meta.dday;
    if (!dd || !dd.date){ b.className = 'dday empty'; b.innerHTML = `<div class="k">D-DAY</div><div class="v">${VIEW ? '정한 목표 없음' : '목표 정하기'}</div>`; return; }
    const n = Math.round((parse(dd.date) - parse(today)) / 864e5);
    b.className = 'dday';
    b.innerHTML = `<div class="k">${esc(dd.title || '목표')}</div><div class="v">${n > 0 ? 'D-' + n : n === 0 ? 'D-DAY' : 'D+' + (-n)}</div>`;
  }
  $('ddayBtn').onclick = () => { if (VIEW) return; $('ddTitle').value = (meta.dday && meta.dday.title) || ''; $('ddDate').value = (meta.dday && meta.dday.date) || ''; $('ddayModal').classList.remove('hidden'); };
  $('ddayModal').addEventListener('click', e => { if (e.target.id === 'ddayModal') $('ddayModal').classList.add('hidden'); });
  async function saveMeta(){
    try { localStorage.setItem('plannerMeta_' + me.code, JSON.stringify({ dday: meta.dday })); } catch(e){}
    try { await db.collection('plannerMeta').doc(me.code).set({ code: me.code, dday: meta.dday || null, updatedAt: FV.serverTimestamp() }); } catch(e){ console.warn(e); }
  }
  $('ddSave').onclick = () => { const t = $('ddTitle').value.trim(), d = $('ddDate').value; if (!d) return toast('날짜를 고르세요');
    meta.dday = { title: t || '목표', date: d }; saveMeta(); renderDday(); $('ddayModal').classList.add('hidden'); };
  $('ddClear').onclick = () => { meta.dday = null; saveMeta(); renderDday(); $('ddayModal').classList.add('hidden'); };

  // ───── 주 이동 ─────
  $('prevW').onclick = () => go(addDays(cur, -7));
  $('nextW').onclick = () => go(addDays(cur, 7));
  $('goToday').onclick = () => go(today);

  loadMeta();
  await go(/^\d{4}-\d{2}-\d{2}$/.test(QS.get('d') || '') && QS.get('d') <= today ? QS.get('d') : today);
  renderStats();
  renderStreak();
})();
</script>
</body>
</html>
