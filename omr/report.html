<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#FAFAF8">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/favicon-64.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="엄형국 수학">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="../pwa.js" defer></script>
<title>성적표 — 엄형국 수학</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="omr.css?v=6">
<style>
  .hero{background:var(--ink);color:#fff;border-radius:14px;padding:22px 20px;margin-bottom:14px;}
  .hero .who{font-size:13px;opacity:.7;}
  .hero .title{font-size:18px;font-weight:900;letter-spacing:-.02em;margin:2px 0 16px;}
  .hero .score{font-size:56px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;}
  .hero .score small{font-size:20px;opacity:.6;font-weight:800;margin-left:4px;}
  .hero .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .hero .chips span{background:rgba(255,255,255,.12);padding:6px 11px;border-radius:99px;font-size:13px;font-weight:700;}
  .hero .chips b{color:#fff;}

  .scale{position:relative;height:56px;margin:26px 6px 6px;}
  .scale .track{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:99px;background:var(--bg2);}
  .scale .range{position:absolute;top:26px;height:6px;border-radius:99px;background:rgba(17,17,20,.2);}
  .scale .mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:11px;color:var(--dim);white-space:nowrap;}
  .scale .mk i{display:block;width:2px;height:14px;background:var(--dim);margin:3px auto 0;}
  .scale .mk.me{color:var(--red);font-weight:900;font-size:12px;top:-6px;}
  .scale .mk.me i{width:14px;height:14px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 1px var(--red);margin-top:6px;}
  .scale .ends{position:absolute;top:38px;left:0;right:0;display:flex;justify-content:space-between;font-size:11px;color:var(--faint);}

  .qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px;}
  .qc{border-radius:8px;padding:7px 4px 6px;text-align:center;border:1px solid var(--line);background:#fff;}
  .qc .n{font-size:11px;color:var(--dim);font-weight:700;}
  .qc .r{font-size:18px;font-weight:900;line-height:1.1;}
  .qc .d{font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .qc.ok .r{color:var(--ok);}
  .qc.no{background:var(--red-soft);border-color:rgba(214,48,31,.25);}
  .qc.no .r{color:var(--red);}
  .qc.part{background:#fdf3e6;border-color:rgba(224,138,46,.35);} .qc.part .r{color:#b45309;font-size:15px;}
  .qc .ty{font-size:9.5px;font-weight:800;color:var(--dim);}
  .qmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px;font-size:12px;color:var(--dim);}
  .qmeta b{color:var(--ink);font-weight:700;}
  .lvp{display:inline-block;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;color:#fff;background:#9a9aa2;}
  .lvp.lv-하{background:#7fb8a4;} .lvp.lv-중{background:#3b6fe0;} .lvp.lv-상{background:#e08a2e;} .lvp.lv-최상{background:#d6301f;}
  .lvrow{display:grid;grid-template-columns:44px 1fr 64px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line2);}
  .lvrow:first-of-type{border-top:0;}
  .lvbars{display:grid;gap:3px;} .lvbars .bar{height:8px;} .lvbars .bar.me i{background:var(--ink);} .lvbars .bar.cls i{background:#c9c9cf;}
  .lvnums{font-size:11px;color:var(--faint);margin-top:4px;}
  .lvv{text-align:right;line-height:1.2;} .lvv b{display:block;font-size:16px;} .lvv span{font-size:11px;color:var(--dim);}

  .wl{display:grid;grid-template-columns:44px 1fr 88px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2);font-size:13.5px;}
  .wl:last-child{border-bottom:0;}
  .wl .ans{font-size:12.5px;color:var(--dim);}
  .wl .rate{font-size:12px;color:var(--dim);text-align:right;}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--dim);margin-bottom:10px;flex-wrap:wrap;}
  .print-bar{display:flex;justify-content:center;margin:14px 0 4px;}
  .card svg{width:100%;height:auto;display:block;}
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
  .legend .sw.dot{border-radius:50%;}
  .hero .chips .gchip{background:var(--red);}
  .cuts{display:grid;gap:6px;}
  .cuts div{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:var(--bg2);font-size:13.5px;}
  .cuts div b{font-size:15px;font-variant-numeric:tabular-nums;}
  .cuts div.me{background:var(--ink);color:#fff;} .cuts div.me .muted{color:rgba(255,255,255,.7);}
  .tbl tr.me td{background:var(--red-soft);font-weight:700;}
  .card .tbl{font-size:12.5px;} .card .tbl th,.card .tbl td.num{white-space:nowrap;}
  .card .tbl td,.card .tbl th{padding:8px 7px;}
  .tbl tr.low td:last-child b{color:var(--red);}
  .tbl a{color:var(--ink);font-weight:700;}
  @page{ size:A4; margin:10mm; }
  @media print{
    body{background:#fff !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .wrap{max-width:none;padding:0;} .print-bar{display:none !important;}
    .card,.hero{break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="../index.html">엄형국 <span>수학</span></a>
    <span class="sub">성적표</span>
  </div>
  <div id="root"><div class="empty">성적표를 불러오는 중…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="common.js?v=20"></script>
<script src="demo.js?v=1"></script>
<script>
(async function(){
  const { db, esc } = OMR;
  const root = document.getElementById('root');
  const token = new URLSearchParams(location.search).get('t');
  const fail = msg => { root.innerHTML = `<div class="empty">${msg}</div>`; };
  const demo = window.DEMO && DEMO.isDemo();
  if (!token && !demo) return fail('잘못된 링크입니다.');

  let r;
  if (demo) r = DEMO.examReport();
  else try {
    const snap = await db.collection('omrReports').doc(token).get();
    if (!snap.exists) return fail('성적표를 찾을 수 없습니다. 링크를 다시 확인해 주세요.');
    r = snap.data();
    // 배점 합의 소수 오차(99.9999…) 보정
    if (typeof r.maxScore === 'number') r.maxScore = OMR.round(r.maxScore, 2);
    (r.history || []).forEach(h => { if (typeof h.max === 'number') h.max = OMR.round(h.max, 2); });
  } catch(e){
    console.error(e);
    return fail(e.code === 'permission-denied'
      ? '아직 공개되지 않은 성적표입니다.<br>선생님이 결과를 공개하면 볼 수 있어요.'
      : '불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
  }
  document.title = `${r.name} · ${r.examTitle} 성적표`;

  const pct = x => r.maxScore ? Math.max(0, Math.min(100, x / r.maxScore * 100)) : 0;
  const wrong = r.questions.filter(q => !q.ok);
  const hardRight = r.questions.filter(q => q.ok && !q.allCorrect && q.rate < 50);
  const tagMap = {};
  r.questions.forEach(q => { if (!q.tag) return; const t = tagMap[q.tag] = tagMap[q.tag] || { tag:q.tag, ok:0, total:0 }; t.total++; if (q.ok) t.ok++; });
  const tagRows = Object.values(tagMap).sort((a,b) => a.ok/a.total - b.ok/b.total);
  const ansText = a => Array.isArray(a) ? (a.length ? esc(a.join(' · ')) : '—') : (a ? esc(a) : '—');
  const TY = { short:'단답', essay:'서술' };
  // 난이도별 결과: 내 득점률 vs 반 평균 정답률
  function levelBlock(){
    const L = ['하', '중', '상', '최상'].filter(l => r.questions.some(q => q.level === l));
    if (!L.length) return '';
    const rows = L.map(l => {
      const qs = r.questions.filter(q => q.level === l);
      const max = qs.reduce((a, q) => a + q.points, 0), mine = qs.reduce((a, q) => a + (q.earned ?? (q.ok ? q.points : 0)), 0);
      const my = max ? mine / max * 100 : 0, cls = qs.reduce((a, q) => a + (q.rate || 0), 0) / qs.length;
      return `<div class="lvrow"><span class="lvp lv-${l}">${l}</span>
        <div><div class="lvbars"><div class="bar me"><i style="width:${my}%"></i></div><div class="bar cls"><i style="width:${cls}%"></i></div></div>
          <div class="lvnums">${qs.length}문항 · ${qs.map(q => q.n).join(', ')}번</div></div>
        <div class="lvv"><b>${Math.round(my)}%</b><span>반 ${Math.round(cls)}%</span></div></div>`;
    }).join('');
    return `<div class="card"><h3>난이도별 결과</h3>
      <div class="legend"><span><span class="sw" style="background:var(--ink);"></span>나의 득점률</span><span><span class="sw" style="background:#c9c9cf;"></span>반 평균 정답률</span></div>${rows}</div>`;
  }
  const qcCls = q => q.ok ? 'ok' : q.type === 'essay' && q.earned > 0 ? 'part' : 'no';
  const qcMark = q => q.type === 'essay' && !q.allCorrect ? `${q.earned}<span style="font-size:10px;">/${q.points}</span>` : (q.ok ? '○' : '✕');

  const G = r.grade, sysLabel = (r.gradeSystem === '9' ? '수능 9등급' : r.gradeSystem === '5' ? '내신 5등급' : '') + (r.cutoffs && r.cutoffs[0] && r.cutoffs[0].manual ? ' · 선생님 지정 컷' : '');
  const topPct = r.percentile != null ? Math.max(0, Math.round((100 - r.percentile) * 10) / 10) : null;
  const C = { ink:'#111114', dim:'#63636B', faint:'#9A9AA2', red:'#D6301F', teal:'#2F8F8B', tealSoft:'#9FD3CF', grid:'rgba(17,17,20,.08)', orange:'#E08A2E' };

  // 점수대별 인원 (내 구간 빨강)
  function histSvg(){
    const h = r.hist; if (!h || !h.length) return '';
    const W = 320, H = 150, pl = 26, pr = 6, pt = 14, pb = 26, mx = Math.max(1, ...h.map(b => b.count));
    const bw = (W - pl - pr) / h.length;
    const y = v => pt + (1 - v / mx) * (H - pt - pb);
    const mine = h.findIndex((b, i) => r.score >= b.from && (r.score < b.to || i === h.length - 1));
    const ticks = [0, Math.ceil(mx / 2), mx];
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="점수 구간별 학생 수">
      ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}" stroke="${C.grid}"/><text x="${pl - 6}" y="${y(t) + 3.5}" text-anchor="end" font-size="9" fill="${C.faint}">${t}</text>`).join('')}
      ${h.map((b, i) => `<rect x="${(pl + i * bw + bw * .18).toFixed(1)}" y="${y(b.count).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${(y(0) - y(b.count)).toFixed(1)}" rx="3" fill="${i === mine ? C.red : C.tealSoft}"/>
        ${b.count ? `<text x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${(y(b.count) - 4).toFixed(1)}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${i === mine ? C.red : C.dim}">${b.count}명</text>` : ''}
        <text x="${(pl + i * bw + bw / 2).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="9" fill="${C.dim}">${b.from}–${b.to}</text>`).join('')}
    </svg>`;
  }

  // 유형별 분석: 막대(진한 = 내 점수, 연한 = 평균), 주황 점 = 상위 30%
  function typeBlock(){
    const ts = (r.types || []).slice().sort((a,b) => (a.mine / a.max) - (b.mine / b.max));
    if (!ts.length) return '';
    const mx = Math.max(...ts.map(t => t.max));
    const W = 320, rowH = 38, pl = 92, pr = 10, H = ts.length * rowH + 24;
    const x = v => pl + v / mx * (W - pl - pr);
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="유형별 점수 비교">
      ${ts.map((t, i) => { const y0 = i * rowH + 6; return `
        <text x="${pl - 8}" y="${y0 + 15}" text-anchor="end" font-size="10.5" font-weight="700" fill="${C.ink}">${esc(t.tag.length > 9 ? t.tag.slice(0, 9) + '…' : t.tag)}</text>
        <rect x="${pl}" y="${y0 + 2}" width="${(x(t.max) - pl).toFixed(1)}" height="24" rx="4" fill="${C.grid}"/>
        <rect x="${pl}" y="${y0 + 3}" width="${Math.max(1, x(t.mine) - pl).toFixed(1)}" height="11" rx="3" fill="${C.teal}"/>
        <rect x="${pl}" y="${y0 + 15}" width="${Math.max(1, x(t.avg) - pl).toFixed(1)}" height="10" rx="3" fill="${C.tealSoft}"/>
        <circle cx="${x(t.top30).toFixed(1)}" cy="${y0 + 8.5}" r="4" fill="${C.orange}" stroke="#fff" stroke-width="1.5"/>`; }).join('')}
      ${[0, mx / 2, mx].map(v => `<text x="${x(v).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="9" fill="${C.faint}">${Math.round(v * 10) / 10}</text>`).join('')}
    </svg>`;
    return `<div class="card"><h3>유형별 분석</h3>
      <div class="legend"><span><i class="sw" style="background:${C.teal}"></i>내 점수</span><span><i class="sw" style="background:${C.tealSoft}"></i>평균</span><span><i class="sw dot" style="background:${C.orange}"></i>상위 30%</span></div>
      ${svg}
      <div class="tbl-wrap" style="margin-top:10px;"><table class="tbl"><tr><th>유형</th><th class="num">석차</th><th class="num">평균</th><th class="num">상위30%</th><th class="num">내 점수</th></tr>
        ${ts.slice().sort((a,b) => a.tag.localeCompare(b.tag, 'ko')).map(t => `<tr${t.mine < t.avg ? ' class="low"' : ''}><td><b>${esc(t.tag)}</b></td><td class="num">${t.rank}위</td><td class="num">${t.avg}점</td><td class="num">${t.top30}점</td><td class="num"><b>${t.mine}</b> / ${t.max}점</td></tr>`).join('')}
      </table></div></div>`;
  }

  // 누적 성적표: 점수 막대 + 등수 선
  function historyBlock(){
    const hs = (r.history || []); if (hs.length < 2) return '';
    const W = 320, H = 160, pl = 10, pr = 30, pt = 16, pb = 26, n = hs.length;
    const cx = i => pl + (i + .5) * (W - pl - pr) / n, bw = Math.min(30, (W - pl - pr) / n * .5);
    const y = p => pt + (1 - p / 100) * (H - pt - pb);
    const maxN = Math.max(...hs.map(h => h.n || 1));
    const yr = rk => pt + (rk - 1) / Math.max(1, maxN - 1) * (H - pt - pb);   // 1등이 위
    const line = hs.map((h, i) => `${i ? 'L' : 'M'}${cx(i).toFixed(1)},${yr(h.rank).toFixed(1)}`).join('');
    const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="시험별 점수와 등수">
      ${[0, 50, 100].map(g => `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" stroke="${C.grid}"/><text x="${W - pr + 4}" y="${y(g) + 3.5}" font-size="9" fill="${C.faint}">${g}%</text>`).join('')}
      ${hs.map((h, i) => { const p = h.max ? h.score / h.max * 100 : 0, me = h.examId === r.examId;
        return `<rect x="${(cx(i) - bw / 2).toFixed(1)}" y="${y(p).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y(0) - y(p)).toFixed(1)}" rx="3" fill="${me ? C.teal : C.tealSoft}"/>
          <text x="${cx(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="9" fill="${C.dim}">${i + 1}회</text>`; }).join('')}
      <path d="${line}" fill="none" stroke="${C.orange}" stroke-width="1.6"/>
      ${hs.map((h, i) => `<circle cx="${cx(i).toFixed(1)}" cy="${yr(h.rank).toFixed(1)}" r="3" fill="${C.orange}"/>`).join('')}
    </svg>`;
    return `<div class="card"><h3>누적 성적표 <span class="muted" style="font-weight:600;">${esc(r.className)}</span></h3>
      <div class="legend"><span><i class="sw" style="background:${C.teal}"></i>점수</span><span><i class="sw dot" style="background:${C.orange}"></i>등수</span></div>
      ${svg}
      <div class="tbl-wrap" style="margin-top:10px;"><table class="tbl"><tr><th>회차</th><th>시험</th><th class="num">점수</th><th class="num">등수</th>${hs.some(h => h.grade) ? '<th class="num">등급</th>' : ''}</tr>
        ${hs.map((h, i) => `<tr${h.examId === r.examId ? ' class="me"' : ''}><td>${i + 1}회</td>
          <td>${h.token && h.examId !== r.examId ? `<a href="report.html?t=${encodeURIComponent(h.token)}">${esc(h.title)}</a>` : esc(h.title)}</td>
          <td class="num"><b>${h.score}</b><span class="muted">/${h.max}</span></td><td class="num">${h.rank}등 <span class="muted">/ ${h.n}명</span></td>
          ${hs.some(x => x.grade) ? `<td class="num">${h.grade ? h.grade + '등급' : '–'}</td>` : ''}</tr>`).join('')}
      </table></div></div>`;
  }

  function retestBlock(){
    const rt = r.retest; if (!rt || !(rt.attempts || []).length) return '';
    return `<div class="card"><h3>재시험 이력</h3>${rt.attempts.map((a, i) => `
      <div class="wl" style="grid-template-columns:70px 1fr 70px;"><b>${i + 1}차 시험</b><span class="ans">${a.at ? OMR.fmtDateTime(a.at) : ''}</span>
        <span style="text-align:right;"><b>${a.score}점</b> <span class="pill ${a.score >= rt.passScore ? 'open' : 'red'}">${a.score >= rt.passScore ? '통과' : '미통과'}</span></span></div>`).join('')}</div>`;
  }

  root.innerHTML = (demo ? DEMO.banner('시험 OMR 성적표') : '') + `
    <div class="hero">
      <div class="who">${esc(r.name)} · ${esc(r.className)}${r.examDate ? ' · ' + esc(r.examDate) : ''}</div>
      <div class="title">${esc(r.examTitle)} <span style="opacity:.6;font-weight:700;font-size:14px;">${esc(r.subject)}</span></div>
      <div class="score">${r.score}<small>/ ${r.maxScore}점</small></div>
      <div class="chips">
        ${G ? `<span class="gchip"><b>${G}등급</b> ${sysLabel}</span>` : ''}
        <span>석차 <b>${r.rank}</b> / ${r.n}명</span>
        ${topPct != null ? `<span>상위 <b>${topPct}</b>%</span>` : `<span>백분위 <b>${r.percentile}</b></span>`}
        <span>맞은 문항 <b>${r.correctCount}</b> / ${r.questionCount}</span>
      </div>
      ${r.passScore != null && r.score < r.passScore ? `<div style="margin-top:14px;background:var(--red);border-radius:8px;padding:10px 12px;font-size:13.5px;font-weight:700;">
        재시험 대상입니다 (기준 ${r.passScore}점). 선생님 안내에 따라 재시험을 준비하세요.</div>` : ''}
    </div>

    <div class="card">
      <h3>통계</h3>
      <div class="stat-grid" style="margin-bottom:4px;">
        ${G ? `<div class="stat"><div class="k">나의 등급</div><div class="v" style="color:var(--red);">${G}<small>등급</small></div></div>` : `<div class="stat"><div class="k">내 점수</div><div class="v" style="color:var(--red);">${r.score}</div></div>`}
        <div class="stat"><div class="k">평균</div><div class="v">${r.avg}<small>점</small></div></div>
        ${r.std != null ? `<div class="stat"><div class="k">표준편차</div><div class="v">${r.std}</div></div>` : ''}
        <div class="stat"><div class="k">최고 점수</div><div class="v">${r.high}<small>점</small></div></div>
        ${topPct != null ? `<div class="stat"><div class="k">상위</div><div class="v">${topPct}<small>%</small></div></div>` : ''}
      </div>
      <div class="scale" aria-hidden="true">
        <div class="track"></div>
        <div class="range" style="left:${pct(r.low)}%;width:${pct(r.high) - pct(r.low)}%;"></div>
        <div class="mk" style="left:${pct(r.avg)}%;">평균<i></i></div>
        <div class="mk me" style="left:${pct(r.score)}%;">나<i></i></div>
        <div class="ends"><span>0</span><span>${r.maxScore}</span></div>
      </div>
    </div>

    ${r.hist ? `<div class="card"><h3>점수대별 인원</h3>${histSvg()}</div>` : ''}

    ${r.cutoffs && r.cutoffs.length ? `<div class="card"><h3>등급 정보 <span class="muted" style="font-weight:600;">${sysLabel}</span></h3>
      <div class="cuts">${r.cutoffs.map(c => c.manual
        ? `<div class="${c.grade === G ? 'me' : ''}"><span>${c.grade}등급${c.score == null ? '' : ' 컷'}</span><b>${c.score == null ? (r.cutoffs[c.grade - 2] ? r.cutoffs[c.grade - 2].score + '점 미만' : '그 외') : c.score + '점 이상'}</b><span class="muted">${c.count}명</span></div>`
        : `<div class="${c.grade === G ? 'me' : ''}"><span>${c.grade}등급 컷</span><b>${c.score}점</b><span class="muted">${c.upTo}등까지</span></div>`).join('')}</div></div>` : ''}

    ${typeBlock()}

    ${r.topWrong && r.topWrong.length ? `<div class="card"><h3>오답률 TOP 5</h3>
      <div class="tbl-wrap"><table class="tbl"><tr><th>순위</th><th>문항</th><th class="num">배점</th><th class="num">정답률</th><th class="num">내 결과</th></tr>
        ${r.topWrong.map((q, i) => { const mine = r.questions[q.n - 1];
          return `<tr><td>${i + 1}위</td><td><b>${q.n}번</b>${q.tag ? ` <span class="muted">${esc(q.tag)}</span>` : ''}</td><td class="num">${q.points}점</td><td class="num">${Math.round(q.rate * 10) / 10}%</td>
            <td class="num">${mine && mine.type === 'essay' && !mine.ok ? `<span class="pill ${mine.earned > 0 ? 'closed' : 'red'}">${mine.earned}/${mine.points}점</span>` : `<span class="pill ${mine && mine.ok ? 'open' : 'red'}">${mine && mine.ok ? '정답' : '오답'}</span>`}</td></tr>`; }).join('')}
      </table></div></div>` : ''}

    ${levelBlock()}

    <div class="card">
      <h3>문항별 정오답</h3>
      <div class="legend"><span>○ 정답</span><span style="color:var(--red);">✕ 오답</span><span>아래 숫자 = 반 정답률</span></div>
      <div class="qgrid">
        ${r.questions.map(q => `
          <div class="qc ${qcCls(q)}" title="${q.type === 'essay' ? `서논술형 ${q.earned}/${q.points}점` : `내 답 ${ansText(q.marked)} / 정답 ${ansText(q.correct)}`}">
            <div class="n">${q.n}번${TY[q.type] ? ` <span class="ty">${TY[q.type]}</span>` : ''}</div><div class="r">${qcMark(q)}</div><div class="d">${Math.round(q.rate)}%</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="card">
      <h3>${wrong.some(q => q.type === 'essay') ? '틀리거나 감점된 문항' : '틀린 문항'} ${wrong.length ? `<span class="pill red">${wrong.length}개</span>` : ''}</h3>
      ${wrong.length ? wrong.map(q => `
        <div class="wl">
          <b>${q.n}번</b>
          <div>
            <div class="ans">${q.type === 'essay'
              ? `서논술형 · 내 점수 <b style="color:${q.earned > 0 ? '#b45309' : 'var(--red)'};">${q.earned}점</b> / ${q.points}점`
              : `${q.type === 'short' ? '단답형 · ' : ''}내 답 <b style="color:var(--red);">${q.blank ? '미응답' : ansText(q.marked)}</b> · 정답 <b style="color:var(--ok);">${ansText(q.correct)}</b> · ${q.points}점`}</div>
            ${q.tag || q.level || q.note ? `<div class="qmeta">${q.level ? `<span class="lvp lv-${esc(q.level)}">${esc(q.level)}</span>` : ''}${q.tag ? `<b>${esc(q.tag)}</b>` : ''}${q.note ? `<span>${esc(q.note)}</span>` : ''}</div>` : ''}
          </div>
          <div class="rate">반 정답률 ${Math.round(q.rate)}%<div class="bar" style="margin-top:4px;"><i style="width:${q.rate}%"></i></div></div>
        </div>`).join('') : '<p class="muted">모든 문항을 맞혔습니다. 👏</p>'}
    </div>

    ${!(r.types && r.types.length) && tagRows.length ? `<div class="card"><h3>단원별 결과</h3>
      ${tagRows.map(t => `<div class="wl" style="grid-template-columns:1fr 70px 88px;">
        <b>${esc(t.tag)}</b><span class="ans" style="text-align:right;">${t.ok}/${t.total} 정답</span>
        <div class="rate">${Math.round(t.ok / t.total * 100)}%<div class="bar" style="margin-top:4px;"><i style="width:${t.ok / t.total * 100}%;${t.ok / t.total < .5 ? 'background:var(--red);' : ''}"></i></div></div>
      </div>`).join('')}</div>` : ''}

    ${retestBlock()}
    ${historyBlock()}

    ${hardRight.length ? `<div class="card"><h3>잘한 문항</h3>
      <p class="muted">반 정답률 50% 미만인데 맞힌 문항: <b style="color:var(--ink);">${hardRight.map(q => q.n + '번').join(', ')}</b></p></div>` : ''}

    <p class="muted" style="text-align:center;margin-top:18px;">엄형국 수학 · 내신성공의 방정식</p>
    <div class="print-bar"><button class="btn" onclick="window.print()">🖨 종이로 인쇄 · PDF 저장</button></div>`;
})();
</script>
</body>
</html>
