<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#FAFAF8">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/favicon-64.png">
<script src="../pwa.js" defer></script>
<title>게시판 관리 — 엄형국 수학</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="omr.css?v=6">
<style>
  .flt{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px;}
  .flt button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:800;}
  .flt button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .flt button small{font-weight:700;opacity:.7;margin-left:3px;}
  .pl{display:grid;gap:8px;}
  .pi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;}
  .pi.hid{opacity:.5;}
  .pi .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pi .t{font-weight:900;font-size:15px;min-width:0;overflow-wrap:anywhere;}
  .pi .m{font-size:12.5px;color:var(--dim);margin-left:auto;white-space:nowrap;}
  .pi .b{margin-top:8px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);}
  .tg{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;background:var(--bg2);color:var(--dim);white-space:nowrap;}
  .tg.nt{background:#FFF0EA;color:var(--red);} .tg.pv{background:#EEF1FF;color:#3B4CCA;} .tg.hd{background:#eee;color:#888;} .tg.wt{background:#FFF7D6;color:#8A6A00;}
  .rp{margin-top:10px;background:var(--bg2);border-radius:10px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;}
  .rp span{display:block;font-size:11.5px;font-weight:900;color:var(--dim);margin-bottom:3px;}
  .ops{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;}
  .rpf{margin-top:10px;display:grid;gap:6px;}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
  .chk input{width:17px;height:17px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="../index.html">엄형국 <span>수학</span> · 관리</a>
    <div class="row"><span class="sub" id="adminEmail"></span><button class="btn sm hidden" id="logoutBtn">로그아웃</button></div>
  </div>
  <nav class="row" id="adminNav" style="gap:4px;margin:-8px 0 16px;"></nav>

  <section id="vLogin" class="hidden" style="max-width:380px;margin:40px auto;">
    <h1>관리자 로그인</h1>
    <div class="card stack">
      <input class="input" type="email" id="loginEmail" placeholder="이메일" autocomplete="username">
      <input class="input" type="password" id="loginPw" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn primary block" id="loginBtn">로그인</button>
      <p class="muted" id="loginMsg"></p>
    </div>
  </section>

  <section id="vMain" class="hidden">
    <div class="kicker">BOARD</div>
    <h1>게시판</h1>
    <p class="muted" style="margin-bottom:14px;">메인 화면 <b>수업 달력 위 게시판</b>이에요. 공지를 올리고, 학생 글(🔒 비공개 포함)을 모두 보고 답변할 수 있어요.</p>
    <div id="permWarn" class="note hidden" style="margin-bottom:14px;border:1px solid var(--red);"><b>Firestore 권한 오류</b> — <code>boardPosts</code>·<code>boardLinks</code> 규칙을 게시했는지 확인하세요.</div>
    <div class="card">
      <h2 id="fHead">공지 쓰기</h2>
      <div class="stack">
        <input class="input" id="fTitle" maxlength="60" placeholder="제목 (예: 10월 시험기간 보강 안내)">
        <textarea class="input" id="fBody" rows="5" maxlength="3000" placeholder="내용"></textarea>
        <label class="chk"><input type="checkbox" id="fPin" checked> 📌 맨 위에 고정</label>
        <div class="row"><button class="btn red" id="saveBtn">공지 올리기</button><button class="btn ghost hidden" id="cancelBtn">취소</button><span class="muted" id="saveMsg"></span></div>
      </div>
    </div>
    <div class="row between" style="margin:22px 0 6px;"><h2 style="margin:0;">전체 글</h2><span class="muted" id="pCount"></span></div>
    <div class="flt" id="flt"></div>
    <div class="pl" id="pList"><div class="muted">불러오는 중…</div></div>
  </section>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="common.js?v=29"></script>
<script>
(function(){
  const { db, FV, esc, toast, toDate } = OMR;
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const fmt = t => { const d = toDate(t); return d && !isNaN(d) ? `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}` : ''; };
  const FL = [['all', '전체'], ['wait', '답변 대기'], ['notice', '공지'], ['public', '공개'], ['private', '🔒 비공개'], ['hidden', '숨김']];
  let posts = [], flt = 'all', editId = null, replyId = null;
  $('adminNav').innerHTML = OMR.adminNav('board.html');
  OMR.mountAdminLogin(user => {
    ['vLogin','vMain'].forEach(x => $(x).classList.toggle('hidden', x !== (user ? 'vMain' : 'vLogin')));
    if (user) load();
  });
  function handleErr(e){ console.error(e); if (e && e.code === 'permission-denied') $('permWarn').classList.remove('hidden'); toast('오류: ' + (e.message || e), 3500); }
  const isWait = p => p.kind === 'post' && p.visibility !== 'hidden' && !(p.reply && p.reply.text);
  const match = p => flt === 'all' ? true
    : flt === 'wait' ? isWait(p) : flt === 'notice' ? p.kind === 'notice'
    : flt === 'hidden' ? p.visibility === 'hidden' : p.kind === 'post' && p.visibility === flt;
  async function load(){
    try {
      posts = (await db.collection('boardPosts').get()).docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => (toDate(b.createdAt) || 0) - (toDate(a.createdAt) || 0));
      render();
    } catch(e){ handleErr(e); $('pList').innerHTML = '<div class="muted">불러오지 못했어요.</div>'; }
  }
  function render(){
    const cnt = k => posts.filter(p => { const o = flt; flt = k; const r = match(p); flt = o; return r; }).length;
    $('flt').innerHTML = FL.map(([k, l]) => `<button type="button" data-f="${k}" class="${k === flt ? 'on' : ''}">${l}<small>${cnt(k)}</small></button>`).join('');
    const list = posts.filter(match);
    $('pCount').textContent = `${posts.length}개 중 ${list.length}개`;
    $('pList').innerHTML = list.length ? list.map(p => {
      const notice = p.kind === 'notice', hid = p.visibility === 'hidden';
      const tag = notice ? `<span class="tg nt">${p.pinned ? '📌 공지' : '공지'}</span>` : hid ? '<span class="tg hd">숨김</span>' : p.visibility === 'private' ? '<span class="tg pv">🔒 비공개</span>' : '<span class="tg">공개</span>';
      return `<div class="pi ${hid ? 'hid' : ''}" data-id="${esc(p.id)}">
        <div class="h">${tag}${isWait(p) ? '<span class="tg wt">답변 대기</span>' : ''}<span class="t">${esc(p.title)}</span>
          <span class="m">${notice ? '선생님' : esc(p.nick || '') + (p.className ? ' · ' + esc(p.className) : '')} · ${fmt(p.createdAt)}</span></div>
        ${p.body ? `<div class="b">${esc(p.body)}</div>` : ''}
        ${p.reply && p.reply.text ? `<div class="rp"><span>선생님 답변 · ${fmt(p.reply.at)}</span>${esc(p.reply.text)}</div>` : ''}
        ${replyId === p.id ? `<div class="rpf"><textarea class="input" id="rpText" rows="3" maxlength="2000" placeholder="답변 (학생 화면에 '선생님 답변'으로 보여요)">${esc((p.reply && p.reply.text) || '')}</textarea>
          <div class="row"><button class="btn primary sm" data-a="rpSave">답변 저장</button><button class="btn ghost sm" data-a="rpCancel">취소</button></div></div>` : ''}
        <div class="ops">
          ${notice ? `<button class="btn sm" data-a="edit">수정</button><button class="btn sm" data-a="pin">${p.pinned ? '고정 해제' : '📌 고정'}</button>`
            : `<button class="btn sm" data-a="reply">${p.reply && p.reply.text ? '답변 수정' : '답변하기'}</button>
               <button class="btn sm" data-a="hide">${hid ? '다시 보이기' : '숨기기'}</button>`}
          <button class="btn ghost sm" data-a="del">삭제</button>
        </div></div>`;
    }).join('') : '<div class="muted">해당하는 글이 없어요.</div>';
    const ta = $('rpText'); if (ta) ta.focus();
  }
  $('flt').onclick = e => { const b = e.target.closest('button'); if (!b) return; flt = b.dataset.f; render(); };
  $('pList').onclick = async e => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const id = b.closest('.pi').dataset.id, p = posts.find(x => x.id === id), ref = db.collection('boardPosts').doc(id), a = b.dataset.a;
    try {
      if (a === 'reply') { replyId = id; render(); return; }
      if (a === 'rpCancel') { replyId = null; render(); return; }
      if (a === 'rpSave') {
        const t = $('rpText').value.trim();
        await ref.update({ reply: t ? { text: t, at: FV.serverTimestamp(), by: 'teacher' } : FV.delete() });
        replyId = null; toast(t ? '답변을 달았어요' : '답변을 지웠어요');
      } else if (a === 'hide') {
        // 숨긴 글은 원래 공개/비공개를 기억해 두었다가 되돌려요
        if (p.visibility === 'hidden') await ref.update({ visibility: p.prevVis || 'public', prevVis: FV.delete() });
        else await ref.update({ visibility: 'hidden', prevVis: p.visibility });
        toast(p.visibility === 'hidden' ? '다시 보이게 했어요' : '숨겼어요 (학생 화면에서 사라져요)');
      } else if (a === 'pin') { await ref.update({ pinned: !p.pinned }); }
      else if (a === 'edit') {
        editId = id; $('fTitle').value = p.title || ''; $('fBody').value = p.body || ''; $('fPin').checked = !!p.pinned;
        $('fHead').textContent = '공지 수정'; $('saveBtn').textContent = '수정 저장'; $('cancelBtn').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' }); return;
      } else if (a === 'del') {
        if (!confirm(`"${p.title}" 글을 삭제할까요? 되돌릴 수 없어요.`)) return;
        await ref.delete(); toast('삭제했어요');
      }
      await load(); OMR.fillNavBadges && OMR.fillNavBadges();
    } catch(err){ handleErr(err); }
  };
  function resetForm(){ editId = null; $('fTitle').value = ''; $('fBody').value = ''; $('fPin').checked = true;
    $('fHead').textContent = '공지 쓰기'; $('saveBtn').textContent = '공지 올리기'; $('cancelBtn').classList.add('hidden'); }
  $('cancelBtn').onclick = resetForm;
  $('saveBtn').onclick = async () => {
    const title = $('fTitle').value.trim(), body = $('fBody').value.trim();
    if (!title) { $('saveMsg').textContent = '제목을 적어 주세요.'; return; }
    $('saveMsg').textContent = '저장 중…';
    try {
      if (editId) await db.collection('boardPosts').doc(editId).update({ title, body, pinned: $('fPin').checked, editedAt: FV.serverTimestamp() });
      else await db.collection('boardPosts').add({ kind: 'notice', title, body, visibility: 'public', pinned: $('fPin').checked, createdAt: FV.serverTimestamp() });
      $('saveMsg').textContent = ''; toast(editId ? '공지를 수정했어요' : '공지를 올렸어요'); resetForm(); flt = 'all'; load();
    } catch(e){ $('saveMsg').textContent = ''; handleErr(e); }
  };
})();
</script>
</body>
</html>
