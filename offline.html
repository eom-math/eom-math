<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">
<title>연결 끊김 — 엄형국 수학</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAFAF8;color:#111114;
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:24px;box-sizing:border-box;text-align:center;}
  .ic{width:72px;height:72px;border-radius:18px;margin:0 auto 20px;background:#111114;color:#fff;font-size:36px;font-weight:900;display:flex;align-items:center;justify-content:center;}

  h1{font-size:24px;font-weight:900;letter-spacing:-.02em;margin:0 0 10px;}
  p{font-size:14.5px;color:#63636B;line-height:1.6;margin:0 0 22px;}
  button{border:0;background:#111114;color:#fff;font:inherit;font-weight:800;font-size:15px;padding:14px 22px;cursor:pointer;}
</style>
</head>
<body>
  <div>
    <div class="ic" aria-hidden="true">엄<i>.</i></div>
    <h1>인터넷 연결이 끊겼어요</h1>
    <p>와이파이나 데이터를 확인한 뒤 다시 시도해 주세요.<br>OMR에 입력하던 답은 이 기기에 임시로 남아 있어요.</p>
    <button onclick="location.reload()">다시 시도</button>
  </div>
